<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="모델이 혼자 넉넉히 하는 과제에서는 가드레일이 있든 없든 통과해서 구분이 되지 않는다. 모델이 아슬아슬한 과제에서는 가드레일이 없을 때의 결과가 달라질 수 있어서, 차이가 난다면 거기서 난다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <style>
      .hd { font-size: 13.5px; font-weight: 700; fill: #57606a; }
      .ti { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .af { font-size: 12.5px; font-weight: 600; fill: #0550ae; }
      .gt { font-size: 13px; fill: #57606a; }
      .cb { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .cn { font-size: 13px; fill: #424a53; }
      .ft { font-size: 12px; fill: #8c959f; }
      .big { font-size: 24px; font-weight: 800; }
    </style>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>
  <text class="hd" x="24" y="30">쉬운 과제에서는 가드레일이 있든 없든 통과한다</text>
  <rect x="24" y="46" width="374" height="232" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="ti" x="44" y="76">모델이 혼자 넉넉히 하는 과제</text>
  <rect x="44" y="94" width="190" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text class="cn" x="60" y="121">가드레일 있음</text>
  <line x1="238" y1="116" x2="266" y2="116" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="270" y="94" width="108" height="44" rx="22" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <text x="324" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#1a7f37">통과</text>
  <rect x="44" y="150" width="190" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text class="cn" x="60" y="177">가드레일 없음</text>
  <line x1="238" y1="172" x2="266" y2="172" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="270" y="150" width="108" height="44" rx="22" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <text x="324" y="178" text-anchor="middle" font-size="15" font-weight="800" fill="#1a7f37">통과</text>
  <text class="cb" x="44" y="228">결과가 같아서 구분이 안 된다</text>
  <text class="gt" x="44" y="250">이번 과제는 이쪽이었을 가능성이 크다</text>

  <rect x="422" y="46" width="374" height="232" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="ti" x="442" y="76">모델이 아슬아슬한 과제</text>
  <rect x="442" y="94" width="190" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text class="cn" x="458" y="121">가드레일 있음</text>
  <line x1="636" y1="116" x2="664" y2="116" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="668" y="94" width="108" height="44" rx="22" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <text x="722" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#1a7f37">통과</text>
  <rect x="442" y="150" width="190" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text class="cn" x="458" y="177">가드레일 없음</text>
  <line x1="636" y1="172" x2="664" y2="172" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="668" y="150" width="108" height="44" rx="22" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
  <text x="722" y="178" text-anchor="middle" font-size="15" font-weight="800" fill="#9a6700">?</text>
  <text class="cb" x="442" y="228">차이가 난다면 여기서 난다</text>
  <text class="gt" x="442" y="250">다음에 재야 할 곳</text>

  <text class="ft" x="410" y="310" text-anchor="middle">보조 장치는 모델이 혼자 안정적으로 못 하는 작업에서 값을 한다 (Anthropic 하네스 설계 글의 요지)</text>
</svg>
