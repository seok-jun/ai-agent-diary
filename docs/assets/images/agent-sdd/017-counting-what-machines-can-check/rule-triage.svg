<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 318" width="820" height="318" role="img" aria-label="규칙 370줄 중 온전히 판정 가능한 것은 16줄, 일부만 가능한 것은 220줄, 판정 불가는 134줄이다. 일부만 가능한 220줄을 판정에 쓰는 기록을 누가 만드는지로 나누면 Agent와 플랫폼 기록이 섞인 것 85줄, Agent가 직접 적은 것 75줄, 플랫폼 기록 57줄, 사람 3줄이다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
  <defs>
    <style>
      .hd { font-size: 13.5px; font-weight: 700; fill: #57606a; }
      .lb { font-size: 13px; font-weight: 700; fill: #1f2328; }
      .gt { font-size: 12.5px; fill: #57606a; }
      .cb { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .cn { font-size: 13px; fill: #424a53; }
      .in { font-size: 12.5px; font-weight: 700; }
    </style>
  </defs>
  <rect width="820" height="318" fill="#ffffff"/>
  <text class="hd" x="24" y="30">규칙 370줄을 기계가 판정할 수 있는지로 나눴다</text>

  <!-- bar 1: x0=24, width 772, 370 rows -> 2.0865 px/row -->
  <rect x="24" y="46" width="33" height="44" rx="4" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <rect x="57" y="46" width="459" height="44" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
  <rect x="516" y="46" width="280" height="44" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text class="in" x="286" y="73" text-anchor="middle" fill="#7d4e00">일부만 판정 가능 220줄</text>
  <text class="in" x="656" y="73" text-anchor="middle" fill="#424a53">판정 불가 134줄</text>
  <line x1="40" y1="92" x2="40" y2="104" stroke="#4ac26b" stroke-width="1.4"/>
  <text class="lb" x="24" y="120" fill="#1a7f37">온전히 판정 가능 16줄</text>
  <text class="gt" x="186" y="120">대부분 기록 형식 (라벨 값, 문서 삭제, 이슈 닫는 참조 등)</text>

  <text class="hd" x="24" y="160">일부만 가능한 220줄: 판정에 쓰는 기록을 누가 만드나</text>
  <!-- bar 2: 220 rows over 772px -> 3.509 px/row -->
  <rect x="24" y="174" width="298" height="44" rx="4" fill="#ffebe9" stroke="#ff8182" stroke-width="1.4"/>
  <rect x="322" y="174" width="263" height="44" fill="#ffebe9" stroke="#ff8182" stroke-width="1.4"/>
  <rect x="585" y="174" width="200" height="44" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <rect x="785" y="174" width="11" height="44" rx="2" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text class="in" x="173" y="201" text-anchor="middle" fill="#a40e26">Agent 기록이 섞임 85</text>
  <text class="in" x="453" y="201" text-anchor="middle" fill="#a40e26">Agent가 직접 적음 75</text>
  <text class="in" x="685" y="201" text-anchor="middle" fill="#0550ae">플랫폼 기록 57</text>
  <text class="gt" x="796" y="236" text-anchor="end">사람 3</text>

  <rect x="24" y="250" width="772" height="52" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="cb" x="44" y="273">160줄은 판정에 쓰는 기록에 검사받는 Agent가 쓴 값이 들어간다.</text>
  <text class="cn" x="44" y="293">승인 순서, 리뷰어 분리, 검증 근거처럼 사고가 났던 규칙이 여기에 있다.</text>
</svg>
