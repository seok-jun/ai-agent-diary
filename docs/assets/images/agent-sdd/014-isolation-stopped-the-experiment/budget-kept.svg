<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 292" width="820" height="292" role="img" aria-label="첫 번째 실험은 한도 4회 중 환경 실패 1회와 통과 3회로 4회를 모두 썼고 18분 22초에 끝났다. 두 번째 실험은 통과 1회 뒤 두 번째 호출 전에 중단했고 남은 2회는 쓰지 않았다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <style>
      .hd { font-size: 13.5px; font-weight: 700; fill: #57606a; }
      .ti { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .af { font-size: 12.5px; font-weight: 600; fill: #0550ae; }
      .gt { font-size: 13px; fill: #57606a; }
      .cb { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .cn { font-size: 13px; fill: #424a53; }
      .ft { font-size: 12px; fill: #8c959f; }
      .big { font-size: 24px; font-weight: 800; }
    </style>
  </defs>
  <rect width="820" height="292" fill="#ffffff"/>
  <text class="hd" x="24" y="30">실패한 호출도 한도에서 뺐고, 멈춘 실험은 이어서 돌리지 않았다</text>
  <text class="cb" x="24" y="74">첫 번째 실험</text>
  <text class="ft" x="24" y="94">한도 4회 · 30분</text>
  <rect x="160" y="52" width="118" height="52" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4" /><text x="219" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#57606a">환경 실패</text><rect x="288" y="52" width="118" height="52" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4" /><text x="347" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a7f37">통과</text><rect x="416" y="52" width="118" height="52" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4" /><text x="475" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a7f37">통과</text><rect x="544" y="52" width="118" height="52" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4" /><text x="603" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a7f37">통과</text>
  <text class="gt" x="680" y="74">18분 22초에</text>
  <text class="gt" x="680" y="94">끝남</text>

  <text class="cb" x="24" y="150">두 번째 실험</text>
  <text class="ft" x="24" y="170">한도 4회 · 30분</text>
  <rect x="160" y="128" width="118" height="52" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4" /><text x="219" y="159" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a7f37">통과</text><rect x="288" y="128" width="118" height="52" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4" /><text x="347" y="159" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a6700">호출 전 중단</text><rect x="416" y="128" width="118" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4"/><text x="475" y="159" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8c959f">쓰지 않음</text><rect x="544" y="128" width="118" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="5 4"/><text x="603" y="159" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8c959f">쓰지 않음</text>
  <text class="gt" x="680" y="150">1회만 쓰고</text>
  <text class="gt" x="680" y="170">끝냄</text>

  <rect x="24" y="210" width="772" height="60" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="cb" x="44" y="235">남은 횟수를 '처음부터 다시'로 되살리지 않았다.</text>
  <text class="cn" x="44" y="257">그렇게 하면 잘된 것만 모아서 끝까지 한 실험처럼 보이게 된다.</text>
</svg>
