<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 356" width="820" height="356" role="img" aria-label="앞 후보의 작업 폴더에는 위에서 물려받은 읽기 차단이 걸려 있지만, 그 안의 파일에는 앞 후보에게 줬던 수정 허용이 파일에 직접 붙어 남아 있어서 다음 후보가 그 파일을 읽을 수 있었다. Windows는 직접 붙은 권한을 물려받은 권한보다 먼저 본다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <style>
      .hd { font-size: 13.5px; font-weight: 700; fill: #57606a; }
      .ti { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .af { font-size: 12.5px; font-weight: 600; fill: #0550ae; }
      .gt { font-size: 13px; fill: #57606a; }
      .cb { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .cn { font-size: 13px; fill: #424a53; }
      .ft { font-size: 12px; fill: #8c959f; }
      .big { font-size: 24px; font-weight: 800; }
    </style>
  </defs>
  <rect width="820" height="356" fill="#ffffff"/>
  <text class="hd" x="24" y="30">폴더에 건 차단보다 파일에 남은 허용이 먼저 적용됐다</text>
  <rect x="24" y="118" width="150" height="76" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <text class="cb" x="99" y="150" text-anchor="middle">다음 후보</text>
  <text class="gt" x="99" y="172" text-anchor="middle">읽으면 안 된다</text>

  <rect x="250" y="56" width="360" height="206" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.4"/>
  <text class="cb" x="268" y="84">앞 후보의 작업 폴더</text>
  <rect x="268" y="96" width="214" height="28" rx="14" fill="#ffffff" stroke="#ff8182"/>
  <text x="375" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#cf222e">읽기 차단 · 위에서 물려받음</text>
  <rect x="290" y="144" width="290" height="96" rx="8" fill="#ffffff" stroke="#d4a72c" stroke-width="1.8"/>
  <text class="cb" x="306" y="172">앞 후보가 쓴 파일</text>
  <rect x="306" y="186" width="222" height="28" rx="14" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="417" y="205" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9a6700">수정 허용 · 파일에 직접 붙음</text>

  <line x1="176" y1="160" x2="286" y2="188" stroke="#cf222e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="222" y="158" text-anchor="middle" font-size="14" font-weight="800" fill="#cf222e">읽힘</text>

  <text class="cb" x="634" y="112">Windows는</text>
  <text class="gt" x="634" y="136">파일에 직접 붙은</text>
  <text class="gt" x="634" y="156">권한을, 위에서</text>
  <text class="gt" x="634" y="176">물려받은 권한보다</text>
  <text class="gt" x="634" y="196">먼저 본다.</text>

  <rect x="24" y="282" width="772" height="60" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="cb" x="44" y="307">차단을 더 쌓지 않고, 앞 후보에게 줬던 쓰기 허용을 회수하는 쪽으로 고쳤다.</text>
  <text class="cn" x="44" y="329">파일마다 차단을 추가하는 방법도 해봤는데 통하지 않았다.</text>
</svg>
