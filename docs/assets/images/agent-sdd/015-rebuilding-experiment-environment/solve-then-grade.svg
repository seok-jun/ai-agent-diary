<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 366" width="820" height="366" role="img" aria-label="당시 요구사항과 구현 전 초기 소스를 새 후보 환경에 넣어 코드 수정과 기존 테스트를 하게 하고, 작업 종료를 확인한 뒤 허용된 소스만 회수한다. 회수한 소스는 별도의 새 평가 환경에서 다시 빌드하고 채점한다. 숨긴 판정용 검사는 평가 환경에만 넣고 후보에게는 주지 않는다. 채점이 끝나면 결과를 기록하고 환경을 종료한다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <style>
      .hd { font-size: 13.5px; font-weight: 700; fill: #57606a; }
      .ti { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .af { font-size: 12.5px; font-weight: 600; fill: #0550ae; }
      .gt { font-size: 13px; fill: #57606a; }
      .cb { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .cn { font-size: 13px; fill: #424a53; }
      .ft { font-size: 12px; fill: #8c959f; }
      .big { font-size: 24px; font-weight: 800; }
    </style>
  </defs>
  <rect width="820" height="366" fill="#ffffff"/>
  <text class="hd" x="24" y="30">푸는 곳과 채점하는 곳을 따로 만들었다</text>

  <text class="af" x="24" y="58">푸는 곳</text>
  <rect x="24" y="66" width="220" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text class="cb" x="134" y="101" text-anchor="middle">당시 요구사항</text><text class="gt" x="134" y="123" text-anchor="middle">+ 구현 전 초기 소스</text>
  <line x1="247" y1="106" x2="297" y2="106" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="300" y="66" width="220" height="80" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/><text class="cb" x="410" y="101" text-anchor="middle">새 후보 환경</text><text class="gt" x="410" y="123" text-anchor="middle">코드 수정 · 기존 테스트</text>
  <line x1="523" y1="106" x2="573" y2="106" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="576" y="66" width="220" height="80" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/><text class="cb" x="686" y="101" text-anchor="middle">작업 종료 확인</text><text class="gt" x="686" y="123" text-anchor="middle">허용된 소스만 회수</text>

  <path d="M686,148 L686,176 L410,176 L410,203" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <text class="af" x="24" y="198">채점하는 곳</text>
  <rect x="24" y="206" width="220" height="80" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="5 4"/><text class="cb" x="134" y="241" text-anchor="middle">숨긴 판정용 검사</text><text class="gt" x="134" y="263" text-anchor="middle">후보에게는 주지 않음</text>
  <line x1="247" y1="246" x2="297" y2="246" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="300" y="206" width="220" height="80" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/><text class="cb" x="410" y="241" text-anchor="middle">새 평가 환경</text><text class="gt" x="410" y="263" text-anchor="middle">다시 빌드 · 채점</text>
  <line x1="523" y1="246" x2="573" y2="246" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="576" y="206" width="220" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text class="cb" x="686" y="241" text-anchor="middle">결과 기록</text><text class="gt" x="686" y="263" text-anchor="middle">환경 종료</text>

  <rect x="24" y="302" width="772" height="48" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="cn" x="44" y="331">후보가 "통과했다"고 말하는 것과, 회수한 코드가 실제로 통과하는 것을 따로 본다.</text>
</svg>
