<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 318" width="820" height="318" role="img" aria-label="14편의 실패는 실행 도구가 막히거나 앞 후보 파일이 읽혀서 모델 결과를 비교할 수 없었다. 이번 진단 과제의 실패는 소스 회수와 독립 채점, 종료까지 끝난 뒤 실행된 검사에서 요구 미충족을 확인한 것이다. 다만 모델 작업 마감과 명령 한도가 결과에 섞였을 가능성은 남아 있다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <style>
      .hd { font-size: 13.5px; font-weight: 700; fill: #57606a; }
      .ti { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .af { font-size: 12.5px; font-weight: 600; fill: #0550ae; }
      .gt { font-size: 13px; fill: #57606a; }
      .cb { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .cn { font-size: 13px; fill: #424a53; }
      .ft { font-size: 12px; fill: #8c959f; }
      .big { font-size: 24px; font-weight: 800; }
    </style>
  </defs>
  <rect width="820" height="318" fill="#ffffff"/>
  <text class="hd" x="24" y="30">14편은 실험장에서 멈췄고, 이번에는 채점까지 갔다</text>

  <rect x="24" y="48" width="120" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text class="cb" x="84" y="84" text-anchor="middle">14편의</text><text class="cb" x="84" y="104" text-anchor="middle">실패</text>
  <rect x="160" y="48" width="303" height="80" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1.4"/><text class="cb" x="311.5" y="83" text-anchor="middle">실행 도구가 막히거나 앞 후보 파일이 읽힘</text><text class="gt" x="311.5" y="105" text-anchor="middle">실험장 쪽에서 멈췄다</text>
  <line x1="466" y1="88" x2="490" y2="88" stroke="#cf222e" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="493" y="48" width="303" height="80" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1.4"/><text class="cb" x="644.5" y="83" text-anchor="middle">모델 결과를 비교할 수 없음</text><text class="gt" x="644.5" y="105" text-anchor="middle">모델이 못한 건지 알 수 없었다</text>

  <rect x="24" y="144" width="120" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text class="cb" x="84" y="180" text-anchor="middle">이번 진단</text><text class="cb" x="84" y="200" text-anchor="middle">과제의 실패</text>
  <rect x="160" y="144" width="303" height="80" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/><text class="cb" x="311.5" y="179" text-anchor="middle">소스 회수 · 독립 채점 · 종료 완료</text><text class="gt" x="311.5" y="201" text-anchor="middle">실험장은 끝까지 돌았다</text>
  <line x1="466" y1="184" x2="490" y2="184" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="493" y="144" width="303" height="80" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/><text class="cb" x="644.5" y="179" text-anchor="middle">실행된 검사에서 요구 미충족 확인</text><text class="gt" x="644.5" y="201" text-anchor="middle">회수한 코드가 요구를 놓쳤다</text>

  <rect x="24" y="242" width="772" height="60" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="cb" x="44" y="267">어디서 실패했는지는 나눌 수 있게 됐다.</text>
  <text class="cn" x="44" y="289">다만 모델 작업 마감과 명령 한도가 결과에 섞였을 가능성은 남아 있다.</text>
</svg>
