<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 322" width="820" height="322" role="img" aria-label="네 단계 그림. 1 예전: 앱 저장소 안에 앱 코드와 Agent 규칙이 섞여 있어 규칙 하나 고치려면 앱 저장소를 같이 연다. 2 계획(10월 2일): 앱 저장소에는 버전만 적고 규칙 묶음은 밖에 둔다. 3 시험 연결(10월 9일~15일): 분리 전에 계획이 맞는지 보려고 앱을 연구 저장소에 일부러 직접 연결해 데이터를 모았다. 4 다시 분리(10월 15일부터): 시험 연결을 끊고 앱 전용 규칙 저장소가 사본을 버전 고정해서 갖는다. 연구 저장소는 기록만 둔다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .ph { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .dt { font-size: 12px; fill: #57606a; }
      .bt { font-size: 13px; font-weight: 700; }
      .tx { font-size: 12px; fill: #424a53; }
      .cp { font-size: 12.5px; fill: #1f2328; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="ahy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="820" height="322" fill="#ffffff"/>

  <!-- panel frames -->
  <rect x="24" y="44" width="184" height="262" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="220" y="44" width="184" height="262" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="416" y="44" width="184" height="262" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="612" y="44" width="184" height="262" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>

  <text class="ph" x="24" y="30">① 예전</text>
  <text class="ph" x="220" y="30">② 계획</text><text class="dt" x="296" y="30">10/02</text>
  <text class="ph" x="416" y="30">③ 시험 연결</text><text class="dt" x="520" y="30">10/09~15</text>
  <text class="ph" x="612" y="30">④ 다시 분리</text><text class="dt" x="716" y="30">10/15~</text>

  <!-- panel 1 -->
  <rect x="36" y="60" width="160" height="132" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <text class="bt" x="48" y="82" fill="#0550ae">앱 저장소</text>
  <rect x="48" y="94" width="136" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text class="tx" x="116" y="116" text-anchor="middle">앱 코드</text>
  <rect x="48" y="138" width="136" height="40" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="bt" x="116" y="163" text-anchor="middle" fill="#7d4e00">Agent 작업 규칙</text>
  <text class="cp" x="36" y="262">규칙 하나 고치려면</text>
  <text class="cp" x="36" y="282">앱 저장소를 같이 연다</text>

  <!-- panel 2 -->
  <rect x="232" y="60" width="160" height="70" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <text class="bt" x="244" y="82" fill="#0550ae">앱 저장소</text>
  <rect x="244" y="92" width="136" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text class="tx" x="312" y="111" text-anchor="middle">"규칙 v1을 쓴다"</text>
  <line x1="312" y1="132" x2="312" y2="160" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="232" y="164" width="160" height="50" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <text class="bt" x="312" y="186" text-anchor="middle" fill="#1a7f37">규칙 묶음 v1</text>
  <text class="tx" x="312" y="204" text-anchor="middle">밖에 따로</text>
  <text class="cp" x="232" y="262">라이브러리처럼</text>
  <text class="cp" x="232" y="282">버전만 적어 둔다</text>

  <!-- panel 3 -->
  <rect x="428" y="60" width="160" height="70" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <text class="bt" x="440" y="82" fill="#0550ae">앱 저장소</text>
  <rect x="440" y="92" width="136" height="28" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text class="tx" x="508" y="111" text-anchor="middle">연구 저장소에 직접 연결</text>
  <line x1="508" y1="132" x2="508" y2="160" stroke="#bf8700" stroke-width="1.8" marker-end="url(#ahy)"/>
  <rect x="428" y="164" width="160" height="50" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
  <text class="bt" x="508" y="186" text-anchor="middle" fill="#7d4e00">연구 저장소</text>
  <text class="tx" x="508" y="204" text-anchor="middle">시험 운영 · 데이터 수집</text>
  <text class="cp" x="428" y="262">계획이 맞는지 보려고</text>
  <text class="cp" x="428" y="282">일부러 직접 이었다</text>

  <!-- panel 4 -->
  <rect x="624" y="60" width="160" height="44" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <text class="bt" x="704" y="87" text-anchor="middle" fill="#0550ae">앱 저장소</text>
  <line x1="704" y1="106" x2="704" y2="128" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="624" y="132" width="160" height="50" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <text class="bt" x="704" y="154" text-anchor="middle" fill="#1a7f37">앱 전용 규칙 저장소</text>
  <text class="tx" x="704" y="172" text-anchor="middle">사본 · 버전 고정</text>
  <rect x="624" y="194" width="160" height="40" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="tx" x="704" y="219" text-anchor="middle">연구 저장소 · 기록만</text>
  <text class="cp" x="624" y="262">시험 연결을 끊고</text>
  <text class="cp" x="624" y="282">사본은 앱 쪽이 갖는다</text>
</svg>
