<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 214" width="820" height="214" role="img" aria-label="표본 10건에서 종료 요약이 처음 생긴 시점: PR을 만들기 전 1건, PR을 만든 뒤 병합 전 8건, 병합 뒤 1건. PR 생성 시점에 알리는 hook이 볼 수 있는 종료 요약은 1건뿐이다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .hd { font-size: 13.5px; font-weight: 700; fill: #57606a; }
      .in { font-size: 13px; font-weight: 700; }
      .gt { font-size: 12.5px; fill: #57606a; }
      .bt { font-size: 14px; font-weight: 700; fill: #1f2328; }
    </style>
  </defs>
  <rect width="820" height="214" fill="#ffffff"/>
  <text class="hd" x="24" y="28">표본 10건 · 종료 요약이 처음 생긴 때</text>

  <!-- 772px / 10 = 77.2 per case -->
  <rect x="24" y="62" width="77" height="48" rx="4" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <rect x="101" y="62" width="618" height="48" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
  <rect x="719" y="62" width="77" height="48" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text class="in" x="62" y="91" text-anchor="middle" fill="#1a7f37">1</text>
  <text class="in" x="410" y="91" text-anchor="middle" fill="#7d4e00">8</text>
  <text class="in" x="757" y="91" text-anchor="middle" fill="#424a53">1</text>
  <text class="gt" x="62" y="130" text-anchor="middle">PR 만들기 전</text>
  <text class="gt" x="410" y="130" text-anchor="middle">PR 만든 뒤 · 병합 전</text>
  <text class="gt" x="757" y="130" text-anchor="middle">병합 뒤</text>

  <line x1="101" y1="52" x2="101" y2="118" stroke="#cf222e" stroke-width="2"/>
  <text class="gt" x="108" y="56" fill="#a40e26">PR 생성 시점</text>

  <rect x="24" y="150" width="772" height="48" rx="10" fill="#ffebe9" stroke="#ff8182" stroke-width="1.4"/>
  <text class="bt" x="44" y="179" fill="#a40e26">PR 생성 때 알리는 hook</text>
  <text class="gt" x="226" y="179">볼 수 있는 종료 요약이 10건 중 1건. 만들어도 알려 줄 게 없다</text>
</svg>
