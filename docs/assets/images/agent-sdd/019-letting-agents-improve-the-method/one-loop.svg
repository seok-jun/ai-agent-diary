<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 214" width="820" height="214" role="img" aria-label="첫 한 바퀴. 관측, 개선안, 사람 채택, 구현과 검사, 새 버전 고정, 프로젝트가 읽음까지는 기록으로 확인했다. 사후 평가는 제한된 대조만 했다. 품질과 비용, 재작업이 줄었는지는 재지 않았다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .hd { font-size: 13.5px; font-weight: 700; fill: #57606a; }
      .bt { font-size: 13.5px; font-weight: 700; }
      .tx { font-size: 12px; fill: #424a53; }
      .lg { font-size: 12.5px; fill: #424a53; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="820" height="214" fill="#ffffff"/>
  <text class="hd" x="24" y="28">10/10~10/11 · 관측에서 방법론 변경까지 한 바퀴</text>

  <g>
    <rect x="24" y="46" width="96" height="64" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
    <text class="bt" x="72" y="74" text-anchor="middle" fill="#1a7f37">관측</text>
    <text class="tx" x="72" y="94" text-anchor="middle">실제 작업 4개</text>

    <rect x="136" y="46" width="96" height="64" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
    <text class="bt" x="184" y="74" text-anchor="middle" fill="#1a7f37">개선안</text>
    <text class="tx" x="184" y="94" text-anchor="middle">Agent가 2개</text>

    <rect x="248" y="46" width="96" height="64" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
    <text class="bt" x="296" y="74" text-anchor="middle" fill="#1a7f37">채택</text>
    <text class="tx" x="296" y="94" text-anchor="middle">사람이 판단</text>

    <rect x="360" y="46" width="96" height="64" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
    <text class="bt" x="408" y="74" text-anchor="middle" fill="#1a7f37">구현·검사</text>
    <text class="tx" x="408" y="94" text-anchor="middle">검사 75개</text>

    <rect x="472" y="46" width="96" height="64" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
    <text class="bt" x="520" y="74" text-anchor="middle" fill="#1a7f37">새 버전</text>
    <text class="tx" x="520" y="94" text-anchor="middle">해시로 고정</text>

    <rect x="584" y="46" width="96" height="64" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
    <text class="bt" x="632" y="74" text-anchor="middle" fill="#1a7f37">프로젝트</text>
    <text class="tx" x="632" y="94" text-anchor="middle">새 버전 읽음</text>

    <rect x="696" y="46" width="100" height="64" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
    <text class="bt" x="746" y="74" text-anchor="middle" fill="#7d4e00">사후 평가</text>
    <text class="tx" x="746" y="94" text-anchor="middle">제한된 대조</text>
  </g>
  <g stroke="#57606a" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="121" y1="78" x2="134" y2="78"/>
    <line x1="233" y1="78" x2="246" y2="78"/>
    <line x1="345" y1="78" x2="358" y2="78"/>
    <line x1="457" y1="78" x2="470" y2="78"/>
    <line x1="569" y1="78" x2="582" y2="78"/>
    <line x1="681" y1="78" x2="694" y2="78"/>
  </g>

  <rect x="24" y="128" width="772" height="40" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text class="bt" x="44" y="153" fill="#424a53">품질·비용·재작업이 줄었는지</text>
  <text class="lg" x="250" y="153">재지 않았다. 한 사례다.</text>

  <rect x="24" y="186" width="14" height="14" rx="3" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="lg" x="46" y="198">기록으로 확인</text>
  <rect x="150" y="186" width="14" height="14" rx="3" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="lg" x="172" y="198">일부만 확인</text>
  <rect x="266" y="186" width="14" height="14" rx="3" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="lg" x="288" y="198">재지 않음</text>
</svg>
