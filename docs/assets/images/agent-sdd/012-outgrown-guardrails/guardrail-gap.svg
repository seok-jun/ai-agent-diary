<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="예전 모델은 혼자 해내는 부분이 작업에 필요한 수준에 못 미쳐서 가드레일이 그 차이를 메웠다. 지금 모델은 혼자 해내는 부분이 필요한 수준까지 올라온 것 같은데 가드레일은 그대로 얹혀 있다. 체감을 그린 것이며 측정값은 아니다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <style>
      .hd { font-size: 13.5px; font-weight: 700; fill: #57606a; }
      .ti { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .af { font-size: 12.5px; font-weight: 600; fill: #0550ae; }
      .gt { font-size: 13px; fill: #57606a; }
      .cb { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .cn { font-size: 13px; fill: #424a53; }
      .ft { font-size: 12px; fill: #8c959f; }
      .big { font-size: 24px; font-weight: 800; }
    </style>
  </defs>
  <rect width="820" height="430" fill="#ffffff"/>
  <text class="hd" x="24" y="30">가드레일은 그때 모델의 약점에 맞춰 만든 것이다</text>

  <rect x="24" y="46" width="374" height="286" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="ti" x="44" y="76">예전 모델</text>
  <line x1="44" y1="150" x2="378" y2="150" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="ft" x="378" y="141" text-anchor="end">작업에 필요한 수준</text>
  <rect x="64" y="232" width="110" height="80" rx="4" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <rect x="64" y="150" width="110" height="82" rx="4" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
  <text class="cb" x="190" y="186">가드레일이 메운 부분</text>
  <text class="gt" x="190" y="207">없으면 놓치는 게 있었다</text>
  <text class="cb" x="190" y="266">모델이 혼자 해내는 부분</text>
  <text class="gt" x="190" y="287">필요한 수준에 못 미쳤다</text>

  <rect x="422" y="46" width="374" height="286" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="ti" x="442" y="76">지금 모델</text>
  <line x1="442" y1="150" x2="776" y2="150" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="5 4"/>
  <rect x="462" y="150" width="110" height="162" rx="4" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <rect x="462" y="98" width="110" height="52" rx="4" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
  <text class="cb" x="588" y="118">같은 가드레일</text>
  <text class="gt" x="588" y="139">이제는 비용? 걸림돌?</text>
  <text class="cb" x="588" y="226">모델이 혼자 해내는 부분</text>
  <text class="gt" x="588" y="247">여기까지 올라온 것 같다</text>

  <rect x="24" y="346" width="772" height="66" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="cb" x="44" y="373">쓰면서 느낀 걸 그림으로 옮긴 것이다. 잰 값은 아니다.</text>
  <text class="cn" x="44" y="396">그래서 이 그림이 맞는지부터 확인하기로 했다.</text>
</svg>
