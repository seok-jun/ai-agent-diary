<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 493" width="640" height="493" role="img" aria-labelledby="title desc">
<title id="title">명세와 반복 개발</title><desc id="desc">명세 구현 완성의 일방향 흐름과, 검증 및 사용자 발견이 다시 명세로 돌아오는 반복 흐름의 비교.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#576574" stroke-width="2"/></marker></defs>
<rect width="640" height="493" rx="16" fill="#fff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="40" font-size="25" fill="#1f2937" text-anchor="start" font-weight="700">명세로 돌아오는 길이 있는가</text><rect x="20" y="65" width="600" height="138" rx="12" fill="#fff4f2" stroke="#d7dfe5"/><text x="40" y="99" font-size="22" fill="#c84b4b" text-anchor="start" font-weight="700">처음 쓴 명세로 끝내려는 흐름</text><rect x="43" y="122" width="156" height="53" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="121" y="155" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="400">명세</text><rect x="242" y="122" width="156" height="53" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="320" y="155" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="400">구현</text><rect x="441" y="122" width="156" height="53" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="519" y="155" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="400">완성 기대</text><path d="M204,149 L235,149" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M403,149 L434,149" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="227" width="600" height="243" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="40" y="264" font-size="22" fill="#18785d" text-anchor="start" font-weight="700">발견에 맞춰 다시 결정하는 흐름</text><rect x="43" y="295" width="156" height="57" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="121" y="331" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="400">작은 명세</text><rect x="242" y="295" width="156" height="57" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="320" y="331" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="400">구현</text><rect x="441" y="295" width="156" height="57" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="519" y="331" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="400">검증·사용</text><path d="M204,324 L235,324" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M403,324 L434,324" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M519,357 V406 H121 V357" fill="none" stroke="#18785d" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="443" font-size="20" fill="#18785d" text-anchor="middle" font-weight="400">새 사실 → 기대 동작·계획·검증 기준 수정</text></g></svg>
