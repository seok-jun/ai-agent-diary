<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 607" width="640" height="607" role="img" aria-labelledby="title desc">
<title id="title">Adaptive SDD와 강연을 함께 적용한 제안</title><desc id="desc">사용자 문제에서 위험에 맞춘 실행, 변경 여지 검토, 허가된 배포 후 결과 확인을 거쳐 다음 작업으로 되돌아간다. 공식 v0.2 워크플로를 대체하지 않는다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#576574" stroke-width="2"/></marker></defs>
<rect width="640" height="607" rx="16" fill="#fff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="40" font-size="25" fill="#1f2937" text-anchor="start" font-weight="700">비교해서 가져갈 작업 흐름</text><text x="28" y="73" font-size="20" fill="#576574" text-anchor="start" font-weight="400">공식 절차의 복제가 아닌, 이 글의 적용 제안</text><rect x="70" y="98" width="542" height="92" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="91" y="134" font-size="23" fill="#2563a6" text-anchor="start" font-weight="700">문제와 인수 조건</text><text x="91" y="166" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">사용자에게 무엇이 달라져야 하나</text><path d="M341,194 L341,208" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="213" width="542" height="92" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="91" y="249" font-size="23" fill="#2563a6" text-anchor="start" font-weight="700">위험에 맞춘 분석·구현·검증</text><text x="91" y="281" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">현재 동작을 확인하고 실제 증거를 남긴다</text><path d="M341,309 L341,323" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="328" width="542" height="92" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="91" y="364" font-size="23" fill="#18785d" text-anchor="start" font-weight="700">다음 변경의 여지 확인</text><text x="91" y="396" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">필요한 정리는 범위 갱신 또는 별도 작업</text><path d="M341,424 L341,438" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="443" width="542" height="92" rx="12" fill="#f5f0fc" stroke="#d7dfe5"/><text x="91" y="479" font-size="23" fill="#7653a4" text-anchor="start" font-weight="700">허가된 배포 후 사용자 결과 확인</text><text x="91" y="511" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">배운 것은 다음 작업과 명세로 돌려보낸다</text><path d="M69,490 H28 V144 H63" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><text x="28" y="580" font-size="20" fill="#576574" text-anchor="start" font-weight="400">각 단계의 발견으로 앞의 판단을 다시 볼 수 있어야 한다</text></g></svg>
