<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 607" width="640" height="607" role="img" aria-labelledby="title desc">
<title id="title">기존 분석과 검토가 다음 변경을 준비하는 흐름</title><desc id="desc">현재 코드와 의존성을 분석하고 새 위험과 변경 영향을 파악한다. 필요한 사람의 판단을 거쳐 계획을 갱신하고 구현과 검증을 수행한다. 새로운 발견이나 다음 변경에서는 다시 분석한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#576574" stroke-width="2"/></marker></defs>
<rect width="640" height="607" rx="16" fill="#fff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="40" font-size="25" fill="#1f2937" text-anchor="start" font-weight="700">기능 추가 전에, 현재 코드를 다시 본다</text><text x="28" y="73" font-size="20" fill="#576574" text-anchor="start" font-weight="400">Adaptive Agentic SDD의 기존 절차를 사례에 대입</text><rect x="60" y="98" width="552" height="92" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="81" y="134" font-size="23" fill="#2563a6" text-anchor="start" font-weight="700">현재 코드와 의존성 분석</text><text x="81" y="166" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">B를 추가할 때 기존 A와의 연결을 확인한다</text><path d="M336,194 L336,208" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="213" width="552" height="92" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="81" y="249" font-size="23" fill="#2563a6" text-anchor="start" font-weight="700">문제와 변경 영향 파악</text><text x="81" y="281" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">새 위험과 유지해야 할 동작을 살핀다</text><path d="M336,309 L336,323" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="328" width="552" height="92" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="81" y="364" font-size="23" fill="#18785d" text-anchor="start" font-weight="700">필요한 판단과 계획 갱신</text><text x="81" y="396" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">사람의 판단이 필요한 변경은 함께 결정한다</text><path d="M336,424 L336,438" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="443" width="552" height="92" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="81" y="479" font-size="23" fill="#18785d" text-anchor="start" font-weight="700">구현·검증 후 다음 작업</text><text x="81" y="511" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">새 발견이나 다음 변경은 다시 분석에서 출발</text><path d="M59,490 H28 V144 H53" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><text x="28" y="580" font-size="20" fill="#576574" text-anchor="start" font-weight="400">분석과 검토가 실제 이해와 필요한 개선으로 이어지는가</text></g></svg>
