<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 715" width="640" height="715" role="img" aria-labelledby="title desc">
<title id="title">구조 정리 작업의 선택과 실행</title><desc id="desc">왼쪽 실선은 새 기능을 위한 기존 코드 분석에서 정리를 발견하고 선행 작업으로 분리한 PR 54의 흐름이다. 오른쪽 점선은 기능 요청이 없어도 반복 수정과 검증 부담을 근거로 정리를 선택하는 경로이며, 누가 언제 우선할지 판단이 필요하다. 선택된 정리 작업은 목표와 범위, 유지할 동작과 검증 조건을 정해 기존 SDD 절차로 수행할 수 있다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#576574" stroke-width="2"/></marker></defs>
<rect width="640" height="715" rx="16" fill="#fff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="40" font-size="25" fill="#1f2937" text-anchor="start" font-weight="700">정리를 실행하는 절차와 선택하는 판단</text><text x="28" y="73" font-size="20" fill="#576574" text-anchor="start" font-weight="400">정리의 필요를 발견한 뒤, 할 일로 선택하는 과정</text><rect x="28" y="102" width="278" height="150" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="48" y="137" font-size="22" fill="#2563a6" text-anchor="start" font-weight="700">새 기능 요청</text><text x="48" y="183" font-size="21" fill="#1f2937" text-anchor="start" font-weight="400">기존 코드 분석</text><text x="48" y="218" font-size="21" fill="#1f2937" text-anchor="start" font-weight="400">필요한 정리 발견</text><rect x="334" y="102" width="278" height="150" rx="12" fill="#fff8ed" stroke="#d7dfe5"/><text x="354" y="137" font-size="22" fill="#8b5b24" text-anchor="start" font-weight="700">기능 요청이 없는 영역</text><text x="354" y="183" font-size="21" fill="#1f2937" text-anchor="start" font-weight="400">반복 수정·검증 부담</text><text x="354" y="218" font-size="21" fill="#1f2937" text-anchor="start" font-weight="400">정리할 근거가 있는가</text><path d="M167,257 L167,288" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M473,257 L473,288" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="28" y="296" width="278" height="68" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="167" y="337" font-size="21" fill="#2563a6" text-anchor="middle" font-weight="700">선행 정리 작업으로 분리</text><rect x="334" y="296" width="278" height="68" rx="12" fill="#fff8ed" stroke="#8b5b24" stroke-width="2" stroke-dasharray="6 5"/><text x="473" y="337" font-size="21" fill="#8b5b24" text-anchor="middle" font-weight="700">누가, 언제 선택할까?</text><path d="M167,369 V394 H305 V417" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M473,369 V394 H335 V417" fill="none" stroke="#576574" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="60" y="425" width="520" height="92" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="320" y="461" font-size="23" fill="#18785d" text-anchor="middle" font-weight="700">선택된 구조 정리 작업</text><text x="320" y="494" font-size="21" fill="#1f2937" text-anchor="middle" font-weight="400">목표·범위·유지할 동작·검증 조건</text><path d="M320,522 L320,549" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="60" y="557" width="520" height="92" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="320" y="593" font-size="23" fill="#18785d" text-anchor="middle" font-weight="700">기존 SDD 절차로 수행</text><text x="320" y="626" font-size="21" fill="#1f2937" text-anchor="middle" font-weight="400">분석 → 검토 → 구현 → 검증</text><text x="28" y="688" font-size="20" fill="#576574" text-anchor="start" font-weight="400">실선: PR #54의 흐름  ·  점선: 더 살펴볼 작업 선택</text></g></svg>
