<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 706" width="640" height="706" role="img" aria-labelledby="title desc">
<title id="title">보류한 합의와 다음 에이전트의 판단 사이</title><desc id="desc">기획과 구현 중 발견한 문제를 보류하기로 합의한다. 누가 언제 이 합의를 다음 관련 작업에 전달할지 점선으로 묻고, 현재 상황에 맞게 다시 판단하는 연결을 그렸다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#576574" stroke-width="2"/></marker></defs>
<rect width="640" height="706" rx="16" fill="#fff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="40" font-size="25" fill="#1f2937" text-anchor="start" font-weight="700">보류한 합의는 다음 작업으로 이어질까</text><text x="28" y="73" font-size="20" fill="#576574" text-anchor="start" font-weight="400">AI 에이전트와의 협업에서 내게 남은 질문</text><rect x="28" y="98" width="584" height="92" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="49" y="134" font-size="23" fill="#2563a6" text-anchor="start" font-weight="700">기획·구현 중 문제를 발견한다</text><text x="49" y="166" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">지금 필요한 수정과 앞으로의 우려를 살핀다</text><path d="M320,194 L320,208" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="213" width="584" height="92" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="49" y="249" font-size="23" fill="#2563a6" text-anchor="start" font-weight="700">지금은 보류하기로 합의한다</text><text x="49" y="281" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">예상 문제 · 보류 이유 · 다시 판단할 시점</text><rect x="28" y="427" width="584" height="92" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="49" y="463" font-size="23" fill="#18785d" text-anchor="start" font-weight="700">다음 관련 작업에서 합의를 다시 본다</text><text x="49" y="495" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">다음 에이전트도 앞의 판단을 이해할 수 있게</text><path d="M320,523 L320,537" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="542" width="584" height="92" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="49" y="578" font-size="23" fill="#18785d" text-anchor="start" font-weight="700">현재 상황에 맞춰 다시 판단한다</text><text x="49" y="610" font-size="20" fill="#1f2937" text-anchor="start" font-weight="400">계속 보류할지, 변경을 계획할지 결정한다</text><path d="M320,309 L320,330" fill="none" stroke="#c84b4b" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="47" y="337" width="546" height="57" rx="12" fill="#fff4f2" stroke="#edc4bf"/><text x="320" y="373" font-size="22" fill="#c84b4b" text-anchor="middle" font-weight="700">누가, 언제 이 합의를 다시 연결할까?</text><path d="M320,399 L320,422" fill="none" stroke="#c84b4b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="28" y="678" font-size="20" fill="#576574" text-anchor="start" font-weight="400">기록의 보관에서 다음 판단까지, 연결이 필요하다</text></g></svg>
