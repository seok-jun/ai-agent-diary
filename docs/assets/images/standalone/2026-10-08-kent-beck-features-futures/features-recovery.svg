<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 455" width="640" height="455" role="img" aria-labelledby="title desc">
<title id="title">기능과 변경 가능성을 번갈아 늘리는 초록 궤적</title><desc id="desc">기능 추가는 오른쪽 아래로, 현재 동작을 유지하는 구조 정리는 위로 이동한다. 회복량을 보장하는 정량 모델이 아니다.</desc>
