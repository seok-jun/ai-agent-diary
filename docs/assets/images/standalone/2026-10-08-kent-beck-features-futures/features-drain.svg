<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 455" width="640" height="455" role="img" aria-labelledby="title desc">
<title id="title">기능만 추가하는 빨간 궤적</title><desc id="desc">가로축 Features, 세로축 Futures. 기능을 추가하며 선택지를 소진하는 개념도이며 실측 곡선이 아니다.</desc>
