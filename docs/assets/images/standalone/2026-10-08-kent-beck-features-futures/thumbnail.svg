<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
<title id="title">기능은 늘었는데 왜 고치기는 어려워졌을까</title><desc id="desc">기능만 늘리는 빨간 궤적과 변경 여지를 회복하는 초록 궤적을 대비한 글 표지.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#576574" stroke-width="2"/></marker></defs>
<rect width="1200" height="630" rx="16" fill="#fff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1200" height="630" rx="12" fill="#eef3ec" stroke="#eef3ec"/><text x="72" y="82" font-size="22" fill="#18785d" text-anchor="start" font-weight="700">AI AGENT DIARY  /  STANDALONE</text><text x="72" y="177" font-size="54" fill="#1f2937" text-anchor="start" font-weight="700">기능은 늘었는데,</text><text x="72" y="250" font-size="54" fill="#1f2937" text-anchor="start" font-weight="700">왜 고치기는 어려워졌을까</text><text x="75" y="310" font-size="28" fill="#576574" text-anchor="start" font-weight="400">켄트 백의 Features와 Futures</text><path d="M80,555 L80,376" fill="none" stroke="#576574" stroke-width="2.5"/><path d="M80,555 L1119,555" fill="none" stroke="#576574" stroke-width="2.5"/><path d="M81,416 C452,418 606,458 736,550" stroke="#c84b4b" fill="none" stroke-width="6" stroke-dasharray="12 10"/><path d="M81,418 L270,447 L270,397 L472,427 L472,374 L675,404 L675,351 L877,381 L877,327 L1088,357" fill="none" stroke="#18785d" stroke-width="7" stroke-linejoin="round"/><text x="920" y="485" font-size="26" fill="#c84b4b" text-anchor="start" font-weight="400">기능만 계속 추가</text><text x="880" y="280" font-size="26" fill="#18785d" text-anchor="start" font-weight="400">다음 변경의 여지</text><text x="80" y="602" font-size="25" fill="#576574" text-anchor="start" font-weight="400">그래프로 풀어 읽고, Adaptive Agentic SDD와 비교하다</text></g></svg>
