<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc">
<title id="title">알림 업체 의존성을 모으는 가상 사례</title><desc id="desc">정리 전에는 주문 배송 취소가 각각 업체를 호출한다. 정리 후에는 공통 알림 경로가 업체를 연결한다. 중복과 재시도의 정확성은 별도 검증한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#576574" stroke-width="2"/></marker></defs>
<rect width="640" height="560" rx="16" fill="#fff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="40" font-size="25" fill="#1f2937" text-anchor="start" font-weight="700">예시 · 문자 업체를 바꿔야 한다면</text><rect x="20" y="62" width="600" height="169" rx="12" fill="#fff4f2" stroke="#d7dfe5"/><text x="38" y="95" font-size="21" fill="#c84b4b" text-anchor="start" font-weight="700">정리 전: 업무 코드마다 업체를 직접 호출</text><rect x="43" y="116" width="115" height="31" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="100" y="139" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="400">주문</text><path d="M166,132 L391,132" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><text x="490" y="139" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="400">문자 업체 API</text><rect x="43" y="153" width="115" height="31" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="100" y="176" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="400">배송</text><path d="M166,169 L391,169" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><text x="490" y="176" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="400">문자 업체 API</text><rect x="43" y="190" width="115" height="31" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="100" y="213" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="400">취소</text><path d="M166,206 L391,206" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><text x="490" y="213" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="400">문자 업체 API</text><text x="320" y="270" font-size="21" fill="#576574" text-anchor="middle" font-weight="400">동작은 유지하고, 업체 의존성을 모은다</text><rect x="20" y="292" width="600" height="207" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="38" y="326" font-size="21" fill="#18785d" text-anchor="start" font-weight="700">정리 후: 공통 경로 뒤에서 업체를 연결</text><rect x="43" y="349" width="101" height="33" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="93" y="373" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="400">주문</text><path d="M150,365 L208,407" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="43" y="390" width="101" height="33" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="93" y="414" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="400">배송</text><path d="M150,406 L208,407" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="43" y="431" width="101" height="33" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="93" y="455" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="400">취소</text><path d="M150,447 L208,407" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="218" y="373" width="177" height="67" rx="12" fill="#fff" stroke="#86bca3"/><text x="306" y="415" font-size="23" fill="#18785d" text-anchor="middle" font-weight="700">알림 경로</text><path d="M401,407 L442,407" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="451" y="373" width="150" height="67" rx="12" fill="#fff" stroke="#d7dfe5"/><text x="526" y="402" font-size="21" fill="#1f2937" text-anchor="middle" font-weight="400">문자 업체</text><text x="526" y="427" font-size="20" fill="#576574" text-anchor="middle" font-weight="400">API</text><text x="28" y="535" font-size="20" fill="#576574" text-anchor="start" font-weight="400">중복 발송·재시도 규칙은 별도 검증이 필요하다</text></g></svg>
