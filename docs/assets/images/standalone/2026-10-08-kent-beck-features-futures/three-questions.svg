<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 415" width="640" height="415" role="img" aria-labelledby="title desc">
<title id="title">코드 생성과 완료 사이의 세 질문</title><desc id="desc">코드 생성, 현재 동작 검증, 미래 변경 검토는 서로 다른 확인이다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#576574" stroke-width="2"/></marker></defs>
<rect width="640" height="415" rx="16" fill="#fff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="40" font-size="25" fill="#1f2937" text-anchor="start" font-weight="700">완료를 확인하는 세 가지 질문</text><rect x="28" y="65" width="584" height="96" rx="12" fill="#eef6ff" stroke="#d7dfe5"/><text x="48" y="103" font-size="24" fill="#2563a6" text-anchor="start" font-weight="700">01</text><text x="104" y="101" font-size="24" fill="#1f2937" text-anchor="start" font-weight="700">코드가 만들어졌나?</text><text x="104" y="135" font-size="21" fill="#576574" text-anchor="start" font-weight="400">함수와 파일이 생겼다</text><rect x="28" y="181" width="584" height="96" rx="12" fill="#edf8f2" stroke="#d7dfe5"/><text x="48" y="219" font-size="24" fill="#18785d" text-anchor="start" font-weight="700">02</text><text x="104" y="217" font-size="24" fill="#1f2937" text-anchor="start" font-weight="700">요구한 대로 동작하나?</text><text x="104" y="251" font-size="21" fill="#576574" text-anchor="start" font-weight="400">실패·중복 요청도 실제로 확인한다</text><rect x="28" y="297" width="584" height="96" rx="12" fill="#fff8ed" stroke="#d7dfe5"/><text x="48" y="335" font-size="24" fill="#8b5b24" text-anchor="start" font-weight="700">03</text><text x="104" y="333" font-size="24" fill="#1f2937" text-anchor="start" font-weight="700">다음에도 바꿀 수 있나?</text><text x="104" y="367" font-size="21" fill="#576574" text-anchor="start" font-weight="400">변경 범위와 얽힌 의존성을 살펴본다</text></g></svg>
