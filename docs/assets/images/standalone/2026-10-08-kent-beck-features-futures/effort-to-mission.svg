<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" role="img" aria-labelledby="title desc">
<title id="title">노력에서 공동의 목적으로</title><desc id="desc">개발 시간과 비용, 알림 기능, 고객 행동 변화, 안심하고 주문한다는 목적의 흐름. 앞 단계를 달성해도 다음 단계는 자동으로 달성되지 않는다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#576574" stroke-width="2"/></marker></defs>
<rect width="640" height="580" rx="16" fill="#fff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="28" y="40" font-size="25" fill="#1f2937" text-anchor="start" font-weight="700">만든 것과 달라진 것을 구분한다</text><rect x="70" y="66" width="500" height="91" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="95" y="101" font-size="24" fill="#2563a6" text-anchor="start" font-weight="700">Effort · 투입</text><text x="95" y="134" font-size="22" fill="#1f2937" text-anchor="start" font-weight="400">개발 시간과 모델 호출 비용</text><path d="M320,162 L320,178" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="183" width="500" height="91" rx="12" fill="#edf5ff" stroke="#d7dfe5"/><text x="95" y="218" font-size="24" fill="#2563a6" text-anchor="start" font-weight="700">Output · 산출물</text><text x="95" y="251" font-size="22" fill="#1f2937" text-anchor="start" font-weight="400">주문 상태 알림을 만들었다</text><path d="M320,279 L320,295" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="300" width="500" height="91" rx="12" fill="#eff8f2" stroke="#d7dfe5"/><text x="95" y="335" font-size="24" fill="#18785d" text-anchor="start" font-weight="700">Outcome · 사용자 변화</text><text x="95" y="368" font-size="22" fill="#1f2937" text-anchor="start" font-weight="400">상태를 묻는 전화가 줄었다</text><path d="M320,396 L320,412" fill="none" stroke="#576574" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="417" width="500" height="91" rx="12" fill="#f5f0fc" stroke="#d7dfe5"/><text x="95" y="452" font-size="24" fill="#7653a4" text-anchor="start" font-weight="700">Mission · 함께 추구할 목적</text><text x="95" y="485" font-size="22" fill="#1f2937" text-anchor="start" font-weight="400">고객이 안심하고 주문을 맡긴다</text><text x="28" y="554" font-size="20" fill="#576574" text-anchor="start" font-weight="400">화살표마다 확인이 필요하다 · 알림 사례는 가상</text></g></svg>
