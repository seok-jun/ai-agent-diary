<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="운영 지표가 평소 범위를 얼마나 벗어났는지에 따라 1시그마는 기록만, 2시그마는 Claude가 읽기 전용으로 진단, 3시그마는 PR을 열거나 사전 승인된 런북만 실행한다. 이상 감지 자체는 모델 없이 결정론적 스크립트가 한다">
  <defs>
    <style>
      .t  { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
      .hd { font-size: 12px; font-weight: 700; fill: #8c959f; letter-spacing: .4px; }
      .bn { font-size: 12px; fill: #57606a; }
      .lv { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .bd { font-size: 12.5px; fill: #424a53; }
      .ft { font-size: 12px; fill: #8c959f; }
    </style>
  </defs>

  <text class="t hd" x="40" y="40">지표 (예: CI 테스트 실패율)</text>
  <text class="t hd" x="500" y="40">이탈 정도에 따라 AI가 할 수 있는 일</text>

  <!-- bands -->
  <rect x="40" y="70" width="420" height="40" fill="#ffebe9"/>
  <rect x="40" y="110" width="420" height="40" fill="#fff1e5"/>
  <rect x="40" y="150" width="420" height="40" fill="#fff8c5"/>
  <rect x="40" y="190" width="420" height="80" fill="#f6f8fa"/>
  <g stroke="#d0d7de" stroke-dasharray="4 3">
    <line x1="40" y1="110" x2="460" y2="110"/>
    <line x1="40" y1="150" x2="460" y2="150"/>
    <line x1="40" y1="190" x2="460" y2="190"/>
  </g>
  <line x1="40" y1="230" x2="460" y2="230" stroke="#8c959f" stroke-width="1.2"/>
  <g class="t bn">
    <text x="48" y="94">3σ 초과</text>
    <text x="48" y="134">2σ</text>
    <text x="48" y="174">1σ</text>
    <text x="48" y="256">평소 평균 (최근 30일 기준선)</text>
  </g>

  <!-- metric line -->
  <polyline fill="none" stroke="#0969da" stroke-width="2.2" stroke-linejoin="round"
    points="50,232 75,224 100,236 125,228 150,220 175,234 200,226 225,214 250,198 275,206 300,180 325,170 350,158 375,140 400,118 420,96"/>
  <circle cx="250" cy="198" r="4.5" fill="#bf8700"/>
  <circle cx="375" cy="140" r="4.5" fill="#bc4c00"/>
  <circle cx="420" cy="96" r="4.5" fill="#cf222e"/>
  <line x1="40" y1="270" x2="460" y2="270" stroke="#d0d7de"/>
  <text class="t ft" x="250" y="290" text-anchor="middle">시간 →</text>

  <!-- tiers -->
  <rect x="500" y="62" width="240" height="66" rx="8" fill="#ffebe9" stroke="#ff8182"/>
  <text class="t lv" x="516" y="86">3σ · 제안까지만 행동</text>
  <text class="t bd" x="516" y="104">PR을 열거나 미리 승인된</text>
  <text class="t bd" x="516" y="120">런북(예: 롤백)만 실행</text>

  <rect x="500" y="138" width="240" height="66" rx="8" fill="#fff1e5" stroke="#fb8f44"/>
  <text class="t lv" x="516" y="162">2σ · 읽기 전용 진단</text>
  <text class="t bd" x="516" y="180">Claude를 불러 원인을 조사</text>
  <text class="t bd" x="516" y="196">코드·설정은 건드리지 않음</text>

  <rect x="500" y="214" width="240" height="56" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="t lv" x="516" y="238">1σ · 기록만</text>
  <text class="t bd" x="516" y="258">스크립트가 로그만 남김</text>

  <text class="t ft" x="40" y="322">이상 감지는 모델 없이 결정론적 스크립트가 한다. AI는 범위를 벗어난 뒤에야 호출되고,</text>
  <text class="t ft" x="40" y="340">결과는 새 intent.md가 되어 일반 리뷰 게이트를 다시 통과한다.</text>
</svg>
