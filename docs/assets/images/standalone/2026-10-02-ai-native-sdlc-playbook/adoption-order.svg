<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="도입 순서. 먼저 선행 조건이 없는 intent.md, CLAUDE.md, 스킬, 검증 수단, 훅 승인 게이트부터 시작하고, 그다음 설계 세션, plan mode, 병렬 세션, eval, AI PR 리뷰를 붙이고, 마지막으로 CI/CD 투입, 정기 보안 스캔, 자동 운영 루프를 연결한다">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <style>
      .t  { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
      .ch { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .cs { font-size: 12px; fill: #8c959f; }
      .it { font-size: 13.5px; font-weight: 600; fill: #1f2328; }
      .sb { font-size: 11.5px; fill: #57606a; }
      .ft { font-size: 12px; fill: #8c959f; }
    </style>
  </defs>

  <text class="t ch" x="30" y="40">① 바로 시작</text>
  <text class="t cs" x="30" y="60">선행 조건 없음</text>
  <rect x="30" y="78" width="200" height="52" rx="7" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="t it" x="42" y="100">intent.md로 아이디어 기록</text>
  <text class="t sb" x="42" y="119">단계: 기획</text>
  <rect x="30" y="140" width="200" height="52" rx="7" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="t it" x="42" y="162">CLAUDE.md 작성</text>
  <text class="t sb" x="42" y="181">단계: 구현</text>
  <rect x="30" y="202" width="200" height="52" rx="7" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="t it" x="42" y="224">스킬로 정책 문서화</text>
  <text class="t sb" x="42" y="243">단계: 구현</text>
  <rect x="30" y="264" width="200" height="52" rx="7" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="t it" x="42" y="286">AI에게 검증 수단 주기</text>
  <text class="t sb" x="42" y="305">단계: 테스트</text>
  <rect x="30" y="326" width="200" height="52" rx="7" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="t it" x="42" y="348">훅으로 승인 게이트</text>
  <text class="t sb" x="42" y="367">단계: 배포</text>
  <text class="t ch" x="280" y="40">② 그다음</text>
  <text class="t cs" x="280" y="60">①이 있어야 효과가 남</text>
  <rect x="280" y="78" width="200" height="52" rx="7" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="t it" x="292" y="100">요구사항·설계 한 세션</text>
  <text class="t sb" x="292" y="119">필요: intent.md, 스킬</text>
  <rect x="280" y="140" width="200" height="52" rx="7" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="t it" x="292" y="162">plan mode로 계획 먼저</text>
  <text class="t sb" x="292" y="181">필요: intent/spec</text>
  <rect x="280" y="202" width="200" height="52" rx="7" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="t it" x="292" y="224">병렬 세션·서브에이전트</text>
  <text class="t sb" x="292" y="243">필요: CLAUDE.md</text>
  <rect x="280" y="264" width="200" height="52" rx="7" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="t it" x="292" y="286">설정 변경마다 eval</text>
  <text class="t sb" x="292" y="305">필요: CLAUDE.md, 검증 수단</text>
  <rect x="280" y="326" width="200" height="52" rx="7" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="t it" x="292" y="348">AI PR 리뷰 루프</text>
  <text class="t sb" x="292" y="367">필요: CLAUDE.md</text>
  <text class="t ch" x="530" y="40">③ 마지막</text>
  <text class="t cs" x="530" y="60">게이트가 먼저 있어야 함</text>
  <rect x="530" y="78" width="200" height="52" rx="7" fill="#fbefff" stroke="#c297ff"/>
  <text class="t it" x="542" y="100">CI/CD에 AI 투입</text>
  <text class="t sb" x="542" y="119">필요: PR 리뷰, 훅 게이트</text>
  <rect x="530" y="140" width="200" height="52" rx="7" fill="#fbefff" stroke="#c297ff"/>
  <text class="t it" x="542" y="162">정기 보안 스캔</text>
  <text class="t sb" x="542" y="181">필요: PR 리뷰, 훅 게이트</text>
  <rect x="530" y="202" width="200" height="52" rx="7" fill="#fbefff" stroke="#c297ff"/>
  <text class="t it" x="542" y="224">루프 닫기 (자동 운영)</text>
  <text class="t sb" x="542" y="243">필요: PR 리뷰, 훅, 롤백 경로</text>
  <line x1="238" y1="200" x2="272" y2="200" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="488" y1="200" x2="522" y2="200" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="t ft" x="30" y="398">처음에는 각 단계를 사람이 직접 프롬프트로 실행하고, 익숙해지면 승인된 산출물이 다음 단계를 자동으로 시작하게 만든다.</text>
</svg>
