<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-label="Eval의 구조를 시험에 빗댄 그림. 시험 문제(task)를 응시자인 에이전트(모델과 하네스)가 여러 번 푼다(trial). 풀이 과정은 답안지(transcript)로, 환경에 남은 결과는 실제 결과(outcome)로 남고, 채점자(grader)가 코드·모델·사람 방식으로 채점해 성적표를 만든다. 이 전체를 eval harness가 운영한다">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .t  { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
      .m  { font-family: SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .hd { font-size: 12px; font-weight: 700; fill: #8c959f; letter-spacing: .4px; }
      .ti { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .af { font-size: 12px; fill: #0550ae; font-weight: 600; }
      .gt { font-size: 12px; fill: #57606a; }
      .hl { font-size: 12.5px; font-weight: 700; fill: #57606a; }
      .cb { font-size: 13.5px; font-weight: 700; fill: #1f2328; }
      .cn { font-size: 13px; fill: #424a53; }
      .ft { font-size: 12px; fill: #8c959f; }
    </style>
  </defs>
  <text class="t hd" x="24" y="30">Eval = AI에게 보는 시험. 문제를 주고, 풀게 하고, 채점해서 성적표를 낸다</text>

  <!-- harness frame -->
  <rect x="12" y="48" width="796" height="226" rx="12" fill="none" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text class="t hl" x="410" y="262" text-anchor="middle">eval harness = 시험 운영 본부 (문제 배포 · 동시 실행 · 기록 · 채점 · 집계)</text>

  <!-- 1. task -->
  <rect x="26" y="68" width="140" height="160" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
  <text class="t ti" x="40" y="96">시험 문제</text>
  <text class="m af" x="40" y="118">task</text>
  <text class="t gt" x="40" y="146">입력 + 합격 기준</text>
  <text class="t gt" x="40" y="168">예: 항공권 예약</text>
  <text class="t gt" x="40" y="190">문제 묶음은</text>
  <text class="t gt" x="40" y="208">eval suite</text>

  <!-- 2. agent -->
  <rect x="184" y="68" width="140" height="160" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <text class="t ti" x="198" y="96">응시자</text>
  <text class="m af" x="198" y="118">agent</text>
  <text class="t gt" x="198" y="146">모델 + 하네스</text>
  <text class="t gt" x="198" y="168">같은 문제를</text>
  <text class="t gt" x="198" y="186">여러 번 푼다</text>
  <text class="m af" x="198" y="208">trial × 3</text>

  <!-- 3a. transcript -->
  <rect x="342" y="68" width="140" height="74" rx="8" fill="#fbefff" stroke="#c297ff" stroke-width="1.4"/>
  <text class="t ti" x="356" y="90">답안지</text>
  <text class="m af" x="356" y="108">transcript</text>
  <text class="t gt" x="356" y="129">대화·도구 호출·추론</text>
  <!-- 3b. outcome -->
  <rect x="342" y="154" width="140" height="74" rx="8" fill="#fbefff" stroke="#c297ff" stroke-width="1.4"/>
  <text class="t ti" x="356" y="176">실제 결과</text>
  <text class="m af" x="356" y="194">outcome</text>
  <text class="t gt" x="356" y="215">예약 DB에 기록 있나</text>

  <!-- 4. grader -->
  <rect x="500" y="68" width="140" height="160" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <text class="t ti" x="514" y="96">채점자</text>
  <text class="m af" x="514" y="118">grader</text>
  <text class="t gt" x="514" y="146">코드: 정답 대조</text>
  <text class="t gt" x="514" y="168">모델: 기준표 채점</text>
  <text class="t gt" x="514" y="190">사람: 전문가 판정</text>
  <text class="t gt" x="514" y="212">섞어서 쓴다</text>

  <!-- 5. report -->
  <rect x="658" y="68" width="136" height="160" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
  <text class="t ti" x="672" y="96">성적표</text>
  <text class="m af" x="672" y="118">score</text>
  <text class="t gt" x="672" y="146">통과율</text>
  <text class="t gt" x="672" y="168">pass@k · pass^k</text>
  <text class="t gt" x="672" y="190">시간 · 토큰 · 비용</text>
  <text class="t gt" x="672" y="212">지난번과 비교</text>

  <!-- arrows -->
  <line x1="167" y1="148" x2="181" y2="148" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="325" y1="105" x2="339" y2="105" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="325" y1="191" x2="339" y2="191" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="483" y1="105" x2="497" y2="105" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="483" y1="191" x2="497" y2="191" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="641" y1="148" x2="655" y2="148" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- callout -->
  <rect x="12" y="294" width="796" height="96" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="t cb" x="32" y="322">말과 결과는 다르다 — 답안지와 실제 결과를 따로 보는 이유</text>
  <text class="t cn" x="32" y="346">에이전트가 "예약 완료했습니다"라고 말해도(답안지), 채점은 예약 DB에 기록이 실제로 생겼는지(실제 결과)를 본다.</text>
  <text class="t cn" x="32" y="368">택배 앱의 "배송 완료" 알림보다 현관 앞에 놓인 상자가 진짜 증거인 것과 같다.</text>

  <text class="t ft" x="410" y="420" text-anchor="middle">원문: Anthropic, Demystifying evals for AI agents (2026.01.09)의 용어 정의를 바탕으로 재구성</text>
</svg>
