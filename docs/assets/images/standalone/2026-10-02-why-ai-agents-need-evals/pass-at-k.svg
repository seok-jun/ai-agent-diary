<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="회당 성공률이 75%인 에이전트를 k번 시도할 때, 한 번이라도 성공할 확률 pass@k는 k=2에서 93.8%, k=3에서 98.4%로 100%에 가까워지고, 매번 성공할 확률 pass^k는 k=3에서 42.2%, k=10에서 5.6%로 떨어진다. k=1에서는 둘 다 75%다">
  <defs>
    <style>
      .t  { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
      .m  { font-family: SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .hd { font-size: 12px; font-weight: 700; fill: #8c959f; letter-spacing: .4px; }
      .ax { font-size: 12px; fill: #57606a; }
      .lb { font-size: 13px; font-weight: 700; fill: #1f2328; }
      .ls { font-size: 12px; fill: #57606a; }
      .vl { font-size: 12.5px; font-weight: 700; fill: #1f2328; }
      .ft { font-size: 12px; fill: #8c959f; }
    </style>
  </defs>
  <text class="t hd" x="24" y="30">회당 성공률 75%인 에이전트를 k번 돌리면: "한 번이라도 성공"과 "매번 성공"은 정반대로 움직인다</text>
  <g class="t" font-size="12.5" fill="#424a53">
    <line x1="84" y1="62" x2="110" y2="62" stroke="#0969da" stroke-width="2.5"/><circle cx="97" cy="62" r="4" fill="#0969da" stroke="#fff" stroke-width="2"/>
    <text x="118" y="66">pass@k — k번 중 한 번이라도 성공</text>
    <line x1="354" y1="62" x2="380" y2="62" stroke="#bc4c00" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="363" y="58" width="8" height="8" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
    <text x="388" y="66">pass^k — k번 모두 성공</text>
  </g>
  <line x1="84" y1="326.0" x2="640" y2="326.0" stroke="#8c959f" stroke-width="1"/>
  <text class="t ax" x="74" y="330.0" text-anchor="end">0%</text>
  <line x1="84" y1="268.5" x2="640" y2="268.5" stroke="#d8dee4" stroke-width="1"/>
  <text class="t ax" x="74" y="272.5" text-anchor="end">25%</text>
  <line x1="84" y1="211.0" x2="640" y2="211.0" stroke="#d8dee4" stroke-width="1"/>
  <text class="t ax" x="74" y="215.0" text-anchor="end">50%</text>
  <line x1="84" y1="153.5" x2="640" y2="153.5" stroke="#d8dee4" stroke-width="1"/>
  <text class="t ax" x="74" y="157.5" text-anchor="end">75%</text>
  <line x1="84" y1="96.0" x2="640" y2="96.0" stroke="#d8dee4" stroke-width="1"/>
  <text class="t ax" x="74" y="100.0" text-anchor="end">100%</text>
  <text class="t ax" x="84.0" y="346" text-anchor="middle">1</text>
  <text class="t ax" x="145.8" y="346" text-anchor="middle">2</text>
  <text class="t ax" x="207.6" y="346" text-anchor="middle">3</text>
  <text class="t ax" x="269.3" y="346" text-anchor="middle">4</text>
  <text class="t ax" x="331.1" y="346" text-anchor="middle">5</text>
  <text class="t ax" x="392.9" y="346" text-anchor="middle">6</text>
  <text class="t ax" x="454.7" y="346" text-anchor="middle">7</text>
  <text class="t ax" x="516.4" y="346" text-anchor="middle">8</text>
  <text class="t ax" x="578.2" y="346" text-anchor="middle">9</text>
  <text class="t ax" x="640.0" y="346" text-anchor="middle">10</text>
  <text class="t ax" x="362.0" y="368" text-anchor="middle">시도 횟수 k</text>
  <line x1="207.6" y1="90" x2="207.6" y2="326" stroke="#8c959f" stroke-width="1" stroke-dasharray="3 3"/>
  <polyline points="84.0,153.5 145.8,110.4 207.6,99.6 269.3,96.9 331.1,96.2 392.9,96.1 454.7,96.0 516.4,96.0 578.2,96.0 640.0,96.0" fill="none" stroke="#0969da" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="84.0,153.5 145.8,196.6 207.6,229.0 269.3,253.2 331.1,271.4 392.9,285.1 454.7,295.3 516.4,303.0 578.2,308.7 640.0,313.0" fill="none" stroke="#bc4c00" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <circle cx="84.0" cy="153.5" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <circle cx="145.8" cy="110.4" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <circle cx="207.6" cy="99.6" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <circle cx="269.3" cy="96.9" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <circle cx="331.1" cy="96.2" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <circle cx="392.9" cy="96.1" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <circle cx="454.7" cy="96.0" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <circle cx="516.4" cy="96.0" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <circle cx="578.2" cy="96.0" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <circle cx="640.0" cy="96.0" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"/>
  <rect x="79.5" y="149.0" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <rect x="141.3" y="192.1" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <rect x="203.1" y="224.5" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <rect x="264.8" y="248.7" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <rect x="326.6" y="266.9" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <rect x="388.4" y="280.6" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <rect x="450.2" y="290.8" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <rect x="511.9" y="298.5" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <rect x="573.7" y="304.2" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <rect x="635.5" y="308.5" width="9" height="9" fill="#bc4c00" stroke="#fff" stroke-width="2"/>
  <text class="t vl" x="94.0" y="171.5">75%</text>
  <text class="t vl" x="215.6" y="119.6">98.4%</text>
  <text class="t vl" x="217.6" y="233.0">42.2%</text>
  <text class="t vl" x="630.0" y="301.0" text-anchor="end">5.6%</text>
  <text class="t lb" x="656" y="100.0" fill="#0969da">pass@k</text>
  <text class="t ls" x="656" y="118.0">"언젠가는 된다"</text>
  <text class="t lb" x="656" y="317.0">pass^k</text>
  <text class="t ls" x="656" y="335.0">"매번 된다"</text>
  <text class="t ft" x="380" y="406" text-anchor="middle">원문 예시(회당 75%, 3번 모두 성공 ≈ 42%)와 같은 가정으로 pass@k = 1 − 0.25ᵏ, pass^k = 0.75ᵏ를 계산해 그림</text>
</svg>
