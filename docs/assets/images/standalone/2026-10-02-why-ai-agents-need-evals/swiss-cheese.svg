  <text class="t cn" x="410" y="352" text-anchor="middle">자동 eval은 첫 방어선일 뿐이다. 빠르고 반복 가능하지만, 실제 사용과 어긋나면 "괜찮다"는 착각을 만든다.</text>
  <text class="t ft" x="410" y="418" text-anchor="middle">원문: Anthropic, Demystifying evals for AI agents (2026.01.09)의 방법 비교와 Swiss Cheese Model 비유를 바탕으로 재구성. 구멍 위치는 예시</text>
</svg>
