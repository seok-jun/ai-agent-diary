  <text class="t nm" x="160" y="302" text-anchor="middle">자동 eval</text>
  <text class="t wh" x="160" y="320" text-anchor="middle">출시 전 · 매 변경</text>
  <text class="t nm" x="275" y="302" text-anchor="middle">운영 모니터링</text>
  <text class="t wh" x="275" y="320" text-anchor="middle">출시 후</text>
  <text class="t nm" x="390" y="302" text-anchor="middle">A/B 테스트</text>
  <text class="t wh" x="390" y="320" text-anchor="middle">큰 변경 검증</text>
