  </defs>
  <text class="t hd" x="24" y="30">어떤 층도 모든 문제를 막지 못한다. 겹쳐 두면 한 층을 빠져나간 문제를 다음 층이 잡는다</text>
  <text class="t cn" x="24" y="56">← 출시 전</text><text class="t cn" x="796" y="56" text-anchor="end">출시 후·상시 →</text>
