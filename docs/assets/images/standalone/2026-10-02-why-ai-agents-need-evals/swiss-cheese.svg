  <text class="t hz" x="20" y="112">문제 A</text>
  <g stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"><line x1="239" y1="101" x2="253" y2="115"/><line x1="239" y1="115" x2="253" y2="101"/></g>
  <text class="t ct" x="257" y="112">잡힘</text>
