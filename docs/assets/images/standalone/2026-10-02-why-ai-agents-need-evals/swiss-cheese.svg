<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="스위스 치즈 모델. 자동 eval, 운영 모니터링, A/B 테스트, 사용자 피드백, 대화 기록 검토, 사람 평가라는 여섯 장의 치즈에는 각각 구멍이 있다. 문제 A는 첫 장의 구멍을 지나 두 번째 장에서, 문제 B는 세 장을 지나 네 번째 장에서, 문제 C는 첫 장에서 잡힌다. 한 층만으로는 모든 문제를 막지 못하지만 겹쳐 두면 잡힌다">
