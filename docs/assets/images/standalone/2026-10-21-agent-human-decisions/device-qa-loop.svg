<polygon points="535.0,260.0 544.0,255.7 544.0,264.3" fill="#328399"/>
<polyline points="345,535 345,627" fill="none" stroke="#328399" stroke-width="3" stroke-linejoin="round"/>
<polygon points="345.0,627.0 340.7,618.0 349.3,618.0" fill="#328399"/>
<rect x="155" y="116" width="380" height="70" rx="16" fill="#E7F3F7" stroke="#328399" stroke-width="2"/>
<text x="345.0" y="160.5" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Agent가 구현</text>
<rect x="155" y="226" width="380" height="69" rx="16" fill="#FFF" stroke="#D5DFE4" stroke-width="2"/>
<text x="345.0" y="270.0" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">실기기에 설치</text>
<rect x="155" y="336" width="380" height="69" rx="16" fill="#FBE8BE" stroke="#BC8936" stroke-width="2"/>
<text x="345.0" y="380.0" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">사람이 사용하며 QA</text>
<rect x="200" y="453" width="290" height="82" rx="16" fill="#FFF" stroke="#D5DFE4" stroke-width="2"/>
<text x="345.0" y="502.36" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" text-anchor="middle">수정할 문제가 남았는가?</text>
<rect x="650" y="453" width="260" height="82" rx="16" fill="#FBE8BE" stroke="#BC8936" stroke-width="2"/>
<text x="780.0" y="502.36" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" text-anchor="middle">증상·기대 동작 전달</text>
<rect x="650" y="604" width="260" height="71" rx="16" fill="#E7F3F7" stroke="#328399" stroke-width="2"/>
<text x="780.0" y="647.86" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Agent가 디버깅·수정</text>
<rect x="155" y="628" width="380" height="82" rx="16" fill="#EAF4EC" stroke="#70A57C" stroke-width="2"/>
<text x="345.0" y="660.12" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="700" text-anchor="middle">확인 결과를 남기고</text>
<text x="345.0" y="696.12" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="24" font-weight="400" text-anchor="middle">이슈 종료</text>
<text x="546" y="479.6" fill="#BC8936" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" text-anchor="start">있음</text>
