<polygon points="345.0,452.0 340.7,443.0 349.3,443.0" fill="#657681"/>
<polyline points="490,493 650,493" fill="none" stroke="#BC8936" stroke-width="3" stroke-linejoin="round"/>
<polygon points="650.0,493.0 641.0,497.3 641.0,488.7" fill="#BC8936"/>
<polyline points="780,535 780,603" fill="none" stroke="#328399" stroke-width="3" stroke-linejoin="round"/>
