<text x="660" y="227.72" fill="#328399" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="400" text-anchor="start">수정본 설치 → 재QA</text>
<text x="40" y="794.6" fill="#657681" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" text-anchor="start">확인한 범위에서의 완료이며, 이후 문제가 없다는 보장은 아니다</text>
