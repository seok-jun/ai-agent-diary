<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" role="img" aria-labelledby="title"><title id="title">이슈 종료 전에 이어가는 실기기 QA</title>
<rect width="960" height="830" fill="#FFFFFF"/>
<text x="40" y="56.4" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="30" font-weight="700" text-anchor="start">02  이슈 종료 전에 이어가는 실기기 QA</text>
<text x="40" y="95.6" fill="#657681" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="20" font-weight="400" text-anchor="start">사람의 관찰을 Agent의 디버깅과 수정으로 연결한다</text>
