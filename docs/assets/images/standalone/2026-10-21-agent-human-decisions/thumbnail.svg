<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title"><title id="title">Agent에게 어디까지 맡길까를 묻다가</title>
<rect width="1200" height="630" fill="#F7F8F5"/>
<rect x="56" y="52" width="7" height="25" rx="3" fill="#328399" stroke="#328399" stroke-width="2"/>
<text x="78" y="70.72" fill="#328399" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="19" font-weight="700" text-anchor="start">AI AGENT DIARY</text>
<text x="1080" y="70.2" fill="#657681" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="15" font-weight="400" text-anchor="start">ESSAY</text>
