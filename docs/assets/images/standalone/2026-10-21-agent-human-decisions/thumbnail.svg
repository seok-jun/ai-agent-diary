<polyline points="970,204 970,277" fill="none" stroke="#328399" stroke-width="3" stroke-linejoin="round"/>
<polygon points="970.0,277.0 965.7,268.0 974.3,268.0" fill="#328399"/>
<polyline points="970,357 970,431" fill="none" stroke="#328399" stroke-width="3" stroke-linejoin="round"/>
<polygon points="970.0,431.0 965.7,422.0 974.3,422.0" fill="#328399"/>
<rect x="851" y="126" width="238" height="78" rx="16" fill="#E7F3F7" stroke="#328399" stroke-width="2"/>
<text x="970.0" y="174.5" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Agent의 탐색</text>
<rect x="851" y="278" width="238" height="78" rx="16" fill="#FBE8BE" stroke="#BC8936" stroke-width="2"/>
<text x="970.0" y="326.5" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">사람의 판단</text>
<rect x="851" y="432" width="238" height="78" rx="16" fill="#E7F3F7" stroke="#328399" stroke-width="2"/>
<text x="970.0" y="480.5" fill="#182D3C" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="700" text-anchor="middle">구현과 검증</text>
<polyline points="1090,472 1137,472 1137,164 1091,164" fill="none" stroke="#328399" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6"/>
<polygon points="1091.0,164.0 1100.0,159.7 1100.0,168.3" fill="#328399"/>
<text x="990" y="245.08" fill="#657681" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="16" font-weight="400" text-anchor="start">질문이 생긴 자리</text>
<text x="990" y="403.08" fill="#657681" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="16" font-weight="400" text-anchor="start">결정한 범위에서</text>
