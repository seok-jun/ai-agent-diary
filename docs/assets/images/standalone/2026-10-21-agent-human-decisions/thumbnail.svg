<text x="65" y="581.84" fill="#657681" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="400" text-anchor="start">의도 조율   /   실기기 QA   /   판단 시점</text>
<text x="1040" y="581.84" fill="#657681" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="18" font-weight="400" text-anchor="start">2026.10</text>
