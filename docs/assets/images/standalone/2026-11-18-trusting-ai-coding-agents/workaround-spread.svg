<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">우회 코드가 퍼지는 순환</title><desc id="desc">아키텍처 충돌을 타이머로 우회하고 주석으로 정당화하면, 그 코드가 다음 작업의 입력이 되어 같은 우회가 반복된다.</desc>
<rect width="960" height="540" fill="#FFFFFF"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="40" y="56" fill="#182D3C" font-size="30" font-weight="700" text-anchor="start">우회 코드가 퍼지는 순환</text>
<text x="40" y="95" fill="#657681" font-size="20" font-weight="400" text-anchor="start">주석이 임시 우회를 설계 근거처럼 보이게 만든다</text>
<rect x="40" y="140" width="250" height="100" rx="16" fill="#F0EBF8" stroke="#9B83BA" stroke-width="2"/><text x="165.0" y="181.9" fill="#182D3C" font-size="22" font-weight="700" text-anchor="middle">아키텍처 충돌</text><text x="165.0" y="213.9" fill="#182D3C" font-size="22" font-weight="400" text-anchor="middle">근본 원인은 그대로</text><polyline points="290,190 353,190" fill="none" stroke="#657681" stroke-width="3" stroke-linejoin="round"/><polygon points="353,190 343.0,195.0 343.0,185.0" fill="#657681"/><rect x="355" y="140" width="250" height="100" rx="16" fill="#FBE9E7" stroke="#C2554D" stroke-width="2"/><text x="480.0" y="181.9" fill="#182D3C" font-size="22" font-weight="700" text-anchor="middle">타이머로 임시 우회</text><text x="480.0" y="213.9" fill="#182D3C" font-size="22" font-weight="400" text-anchor="middle">+ 정당화하는 주석</text><polyline points="605,190 668,190" fill="none" stroke="#657681" stroke-width="3" stroke-linejoin="round"/><polygon points="668,190 658.0,195.0 658.0,185.0" fill="#657681"/><rect x="670" y="140" width="250" height="100" rx="16" fill="#FBE8BE" stroke="#BC8936" stroke-width="2"/><text x="795.0" y="181.9" fill="#182D3C" font-size="22" font-weight="700" text-anchor="middle">코드베이스에 남는다</text><text x="795.0" y="213.9" fill="#182D3C" font-size="22" font-weight="400" text-anchor="middle">다음 작업의 입력</text><polyline points="795,240 795,300 480,300 480,243" fill="none" stroke="#C2554D" stroke-width="3" stroke-linejoin="round"/><polygon points="480,243 485.0,253.0 475.0,253.0" fill="#C2554D"/><text x="637" y="334" fill="#C2554D" font-size="20" font-weight="400" text-anchor="middle">다음 에이전트가 같은 방식을 따라 쓴다</text><rect x="40" y="390" width="880" height="110" rx="16" fill="#E7F3F7" stroke="#328399" stroke-width="2"/><text x="480.0" y="436.9" fill="#182D3C" font-size="22" font-weight="700" text-anchor="middle">순환을 끊으려면</text><text x="480.0" y="468.9" fill="#182D3C" font-size="22" font-weight="400" text-anchor="middle">주석 대신 린트 규칙으로 막고, 오류 메시지로 근본 원인을 고치게 안내한다</text>
</g>
</svg>
