<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">검증된 작업 하나에 드는 전체 비용</title><desc id="desc">검증을 아끼면 재작업이 늘고, 무조건 늘리면 검증 비용이 커진다. 위험도에 맞춘 검증이 전체 비용을 줄일 수 있다는 개념도.</desc>
<rect width="960" height="620" fill="#FFFFFF"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="40" y="56" fill="#182D3C" font-size="30" font-weight="700" text-anchor="start">검증된 작업 하나에 드는 전체 비용</text>
<text x="40" y="95" fill="#657681" font-size="20" font-weight="400" text-anchor="start">개념을 보여 주는 그림이다. 실제 측정값이 아니다</text>
<text x="40" y="156" fill="#182D3C" font-size="22" font-weight="700" text-anchor="start">검증을 아낀 경우</text><rect x="40" y="170" width="190" height="64" rx="10" fill="#E7F3F7" stroke="#328399" stroke-width="2"/><text x="135.0" y="210" fill="#182D3C" font-size="20" font-weight="700" text-anchor="middle">구현</text><rect x="236" y="170" width="70" height="64" rx="10" fill="#FBE8BE" stroke="#BC8936" stroke-width="2"/><text x="271.0" y="210" fill="#182D3C" font-size="20" font-weight="700" text-anchor="middle">검증</text><rect x="312" y="170" width="430" height="64" rx="10" fill="#FBE9E7" stroke="#C2554D" stroke-width="2"/><text x="527.0" y="210" fill="#182D3C" font-size="20" font-weight="700" text-anchor="middle">재작업 · 뒤늦은 결함 수정</text><text x="40" y="296" fill="#182D3C" font-size="22" font-weight="700" text-anchor="start">위험도에 맞춰 검증한 경우</text><rect x="40" y="310" width="190" height="64" rx="10" fill="#E7F3F7" stroke="#328399" stroke-width="2"/><text x="135.0" y="350" fill="#182D3C" font-size="20" font-weight="700" text-anchor="middle">구현</text><rect x="236" y="310" width="230" height="64" rx="10" fill="#FBE8BE" stroke="#BC8936" stroke-width="2"/><text x="351.0" y="350" fill="#182D3C" font-size="20" font-weight="700" text-anchor="middle">검증</text><rect x="472" y="310" width="110" height="64" rx="10" fill="#FBE9E7" stroke="#C2554D" stroke-width="2"/><text x="527.0" y="350" fill="#182D3C" font-size="20" font-weight="700" text-anchor="middle">재작업</text><text x="40" y="436" fill="#182D3C" font-size="22" font-weight="700" text-anchor="start">검증을 무조건 늘린 경우</text><rect x="40" y="450" width="190" height="64" rx="10" fill="#E7F3F7" stroke="#328399" stroke-width="2"/><text x="135.0" y="490" fill="#182D3C" font-size="20" font-weight="700" text-anchor="middle">구현</text><rect x="236" y="450" width="420" height="64" rx="10" fill="#FBE8BE" stroke="#BC8936" stroke-width="2"/><text x="446.0" y="490" fill="#182D3C" font-size="20" font-weight="700" text-anchor="middle">검증 · 실행 시간 · 오탐 대응</text><rect x="662" y="450" width="110" height="64" rx="10" fill="#FBE9E7" stroke="#C2554D" stroke-width="2"/><text x="717.0" y="490" fill="#182D3C" font-size="20" font-weight="700" text-anchor="middle">재작업</text><line x1="40" y1="552" x2="920" y2="552" stroke="#D5DFE4" stroke-width="2"/><text x="40" y="590" fill="#657681" font-size="21" font-weight="400" text-anchor="start">봐야 할 것은 검증의 비율이 아니라 막대 전체의 길이다</text>
</g>
</svg>
