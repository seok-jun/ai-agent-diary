<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">실패가 제약이 되기까지</title><desc id="desc">실패를 기록하고 고칠 가치를 판단한 뒤, 설계, 검사, 산문 순서로 수단을 고르고 효과를 다시 확인하는 흐름.</desc>
<rect width="960" height="790" fill="#FFFFFF"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="40" y="56" fill="#182D3C" font-size="30" font-weight="700" text-anchor="start">실패가 제약이 되기까지</text>
<text x="40" y="95" fill="#657681" font-size="20" font-weight="400" text-anchor="start">실패를 곧바로 규칙으로 만들지 않고, 판단을 한 번 거친다</text>
<rect x="290" y="130" width="380" height="62" rx="16" fill="#FBE9E7" stroke="#C2554D" stroke-width="2"/><text x="480.0" y="168.9" fill="#182D3C" font-size="22" font-weight="700" text-anchor="middle">에이전트의 실패</text><polyline points="480,192 480,226" fill="none" stroke="#657681" stroke-width="3" stroke-linejoin="round"/><polygon points="480,226 475.0,216.0 485.0,216.0" fill="#657681"/><rect x="290" y="228" width="380" height="62" rx="16" fill="#FBE8BE" stroke="#BC8936" stroke-width="2"/><text x="480.0" y="266.9" fill="#182D3C" font-size="22" font-weight="700" text-anchor="middle">근거와 함께 기록한다</text><polyline points="480,290 480,324" fill="none" stroke="#657681" stroke-width="3" stroke-linejoin="round"/><polygon points="480,324 475.0,314.0 485.0,314.0" fill="#657681"/><rect x="250" y="326" width="460" height="100" rx="16" fill="#FFFFFF" stroke="#D5DFE4" stroke-width="2"/><text x="480.0" y="368.1" fill="#182D3C" font-size="21" font-weight="700" text-anchor="middle">고칠 가치가 있는가?</text><text x="480.0" y="399.1" fill="#182D3C" font-size="21" font-weight="400" text-anchor="middle">반복 · 위험도 · 기대 효과 · 적용 비용</text><polyline points="710,376 758,376" fill="none" stroke="#BC8936" stroke-width="3" stroke-linejoin="round"/><polygon points="758,376 748.0,381.0 748.0,371.0" fill="#BC8936"/><text x="734" y="362" fill="#BC8936" font-size="18" font-weight="400" text-anchor="middle">아직</text><rect x="760" y="340" width="160" height="72" rx="16" fill="#FBE8BE" stroke="#BC8936" stroke-width="2"/><text x="840.0" y="383.6" fill="#182D3C" font-size="21" font-weight="700" text-anchor="middle">기록만 유지</text><polyline points="480,426 480,488" fill="none" stroke="#328399" stroke-width="3" stroke-linejoin="round"/><polygon points="480,488 475.0,478.0 485.0,478.0" fill="#328399"/><text x="498" y="464" fill="#328399" font-size="19" font-weight="400" text-anchor="start">고친다</text><text x="480" y="520" fill="#657681" font-size="20" font-weight="400" text-anchor="middle">어떤 수단으로 막을지 왼쪽부터 따져 본다</text><rect x="40" y="540" width="270" height="100" rx="16" fill="#E7F3F7" stroke="#328399" stroke-width="2"/><text x="175.0" y="582.1" fill="#182D3C" font-size="21" font-weight="700" text-anchor="middle">① 설계로 없앤다</text><text x="175.0" y="613.1" fill="#182D3C" font-size="21" font-weight="400" text-anchor="middle">API · 구조 · 리팩터링</text><polyline points="310,590 343,590" fill="none" stroke="#657681" stroke-width="3" stroke-linejoin="round"/><polygon points="343,590 333.0,595.0 333.0,585.0" fill="#657681"/><rect x="345" y="540" width="270" height="100" rx="16" fill="#E7F3F7" stroke="#328399" stroke-width="2"/><text x="480.0" y="582.1" fill="#182D3C" font-size="21" font-weight="700" text-anchor="middle">② 검사로 막는다</text><text x="480.0" y="613.1" fill="#182D3C" font-size="21" font-weight="400" text-anchor="middle">린트 · 테스트 · CI</text><polyline points="615,590 648,590" fill="none" stroke="#657681" stroke-width="3" stroke-linejoin="round"/><polygon points="648,590 638.0,595.0 638.0,585.0" fill="#657681"/><rect x="650" y="540" width="270" height="100" rx="16" fill="#F0EBF8" stroke="#9B83BA" stroke-width="2"/><text x="785.0" y="582.1" fill="#182D3C" font-size="21" font-weight="700" text-anchor="middle">③ 산문으로 남긴다</text><text x="785.0" y="613.1" fill="#182D3C" font-size="21" font-weight="400" text-anchor="middle">지침 · 사람의 리뷰</text><polyline points="480,640 480,688" fill="none" stroke="#328399" stroke-width="3" stroke-linejoin="round"/><polygon points="480,688 475.0,678.0 485.0,678.0" fill="#328399"/><rect x="290" y="690" width="380" height="62" rx="16" fill="#E7F3F7" stroke="#328399" stroke-width="2"/><text x="480.0" y="728.9" fill="#182D3C" font-size="22" font-weight="700" text-anchor="middle">효과를 다시 확인한다</text><polyline points="290,721 22,721 22,259 288,259" fill="none" stroke="#328399" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="288,259 278.0,264.0 278.0,254.0" fill="#328399"/><text x="36" y="488" fill="#328399" font-size="18" font-weight="400" text-anchor="start">다음 기록으로</text>
</g>
</svg>
