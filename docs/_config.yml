title: seok jun.log archive
description: >-
  AI Agent 개발, SDD, 개발 방법론, 그리고 AI 시대에 대한 이야기를 다루는 개인 기술 블로그입니다.
theme: just-the-docs
timezone: Asia/Seoul

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/favicon/favicon-512.png
  - scope:
      path: "google324e868b431a4f00.html"
    values:
      sitemap: false
# GitHub Pages project-site settings — this repo is public, so this builds to
# https://<github-username>.github.io/ai-agent-diary/
# If you rename the repo, update baseurl to match.
url: "https://seok-jun.github.io"
baseurl: "/ai-agent-diary"

color_scheme: light
logo: "/assets/images/brand/wordmark-sidebar.svg"
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "맨 위로"
last_edit_timestamp: false
gh_edit_link: true
gh_edit_link_text: "이 페이지를 GitHub에서 수정하기"
gh_edit_repository: "https://github.com/seok-jun/ai-agent-diary"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

aux_links:
  "Velog 원본":
    - "https://velog.io/@hiha12ha/posts"
  "GitHub repo":
    - "https://github.com/seok-jun/ai-agent-diary"
aux_links_new_tab: true

nav_sort: case_insensitive

# Social sharing (Open Graph / Twitter cards via jekyll-seo-tag)
author:
  name: seok jun
twitter:
  card: summary_large_image

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Only files under docs/ are Jekyll source; the rest of the repo (README, _meta)
# is plain GitHub browsing, not part of the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
