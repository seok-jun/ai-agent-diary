<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="공개 경로. 연구 저장소에서 설계와 검증을 하고, 검토한 파일만 공개 저장소로 옮긴다. 공개 저장소에는 v1-preview branch의 태그 v1.0.0-preview.1을 pre-release로 달고, main은 v0.2 그대로 두며 v0.2.0 태그로 고정한다. 회사 프로젝트는 태그를 고정해 복사하고 해시를 기록한 뒤 자기 어댑터로 조정한다. 공통에 빠진 것은 회사 공개 정책을 확인한 뒤 일반화한 것만 공개 이슈로 올려 다음 preview에 반영한다. 연구 저장소를 프로젝트가 직접 읽는 길은 없다" font-family='Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'>
  <defs>
    <style>
      .bt { font-size: 13px; font-weight: 700; }
      .tx { font-size: 12px; fill: #424a53; }
      .dt { font-size: 12px; fill: #57606a; }
      .cp { font-size: 12px; fill: #57606a; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="820" height="320" fill="#ffffff"/>

  <!-- research repo -->
  <rect x="24" y="40" width="160" height="96" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
  <text class="bt" x="40" y="64" fill="#7d4e00">연구 저장소</text>
  <text class="tx" x="40" y="86">설계 · 검증 · 기록</text>
  <text class="tx" x="40" y="104">비공개</text>
  <text class="dt" x="40" y="124">아무도 직접 읽지 않는다</text>

  <!-- research -> public -->
  <line x1="186" y1="88" x2="236" y2="88" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="cp" x="211" y="78" text-anchor="middle">검토한</text>
  <text class="cp" x="211" y="106" text-anchor="middle">파일만</text>

  <!-- public repo -->
  <rect x="240" y="24" width="230" height="176" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text class="bt" x="254" y="46" fill="#1f2328">공개 저장소</text>
  <rect x="254" y="56" width="202" height="72" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <text class="bt" x="266" y="77" fill="#1a7f37">v1-preview branch</text>
  <text class="tx" x="266" y="96">태그 v1.0.0-preview.1</text>
  <text class="tx" x="266" y="114">pre-release</text>
  <rect x="254" y="138" width="202" height="50" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text class="bt" x="266" y="158" fill="#424a53">main</text>
  <text class="tx" x="266" y="177">v0.2 그대로 · 태그 v0.2.0</text>

  <!-- public -> company -->
  <line x1="472" y1="88" x2="584" y2="88" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
  <text class="cp" x="528" y="78" text-anchor="middle">태그 고정 복사</text>
  <text class="cp" x="528" y="106" text-anchor="middle">해시 기록</text>

  <!-- company project -->
  <rect x="588" y="40" width="208" height="96" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <text class="bt" x="604" y="64" fill="#0550ae">회사 프로젝트</text>
  <text class="tx" x="604" y="86">공통 사본: 고치지 않는다</text>
  <text class="tx" x="604" y="104">어댑터: 프로젝트 값만</text>
  <text class="dt" x="604" y="124">작업 기록은 회사에 남는다</text>

  <!-- return path: company -> public issue -> next preview -->
  <path d="M692,138 L692,250 L470,250" fill="none" stroke="#57606a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <text class="cp" x="702" y="196">공개 정책 확인 뒤</text>
  <text class="cp" x="702" y="214">일반화한 것만</text>
  <rect x="300" y="232" width="168" height="36" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text class="tx" x="384" y="255" text-anchor="middle">공개 이슈</text>
  <line x1="384" y1="230" x2="384" y2="204" stroke="#57606a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <text class="cp" x="392" y="222">preview.2</text>

  <!-- forbidden direct read -->
  <path d="M104,138 C104,330 600,330 612,140" fill="none" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#ahr)"/>
  <text class="dt" x="384" y="310" text-anchor="middle" fill="#cf222e">연구 저장소를 직접 읽는 길은 없다 (18편)</text>
</svg>
