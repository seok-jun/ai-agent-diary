<!doctype html>
<!-- 2026-11-18 단독 글 섬네일 원본. 1672×941로 캡처한다.
     chrome --headless=new --hide-scrollbars --window-size=1672,941 --screenshot=thumbnail.png <이 파일> -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1672px; height: 941px; overflow: hidden; background: #FBF3E2; }
  svg { display: block; }
  text { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF6E7"/>
      <stop offset="1" stop-color="#F8E6CC"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0.10 0"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1672" height="941" fill="url(#bg)"/>
  <!-- desk -->
  <path d="M0 800 L1672 760 L1672 941 L0 941 Z" fill="#EBD2AC"/>
  <path d="M0 800 L1672 760" stroke="#D9BD92" stroke-width="3"/>

  <!-- plant -->
  <g transform="translate(30 560)">
    <path d="M40 240 C10 150 20 70 70 10 C90 90 80 170 60 240 Z" fill="#8FA584"/>
    <path d="M70 240 C90 180 130 140 190 130 C170 190 130 230 90 245 Z" fill="#A9BC9C"/>
    <path d="M10 235 H120 L108 330 H22 Z" fill="#7E9475"/>
  </g>

  <!-- the ever-growing rule sheet -->
  <g transform="translate(250 505) rotate(-5)">
    <rect x="18" y="26" width="430" height="520" rx="10" fill="#5B4A36" opacity="0.18" filter="url(#soft)"/>
    <rect x="0" y="0" width="430" height="520" rx="10" fill="#FFFDF8" stroke="#D8CBB5" stroke-width="3"/>
    <rect x="0" y="0" width="430" height="64" rx="10" fill="#F1E7D6"/>
    <circle cx="30" cy="32" r="8" fill="#E8743B"/><circle cx="56" cy="32" r="8" fill="#F2B24C"/><circle cx="82" cy="32" r="8" fill="#8FA584"/>
    <text x="118" y="43" font-size="28" font-weight="700" fill="#5B4A36">AGENTS.md</text>
    <g stroke-linecap="round" stroke-width="13">
      <path d="M36 104 H330" stroke="#CFC6B8"/>
      <path d="M36 142 H380" stroke="#CFC6B8"/>
      <path d="M36 180 H290" stroke="#F2B9A0"/>
      <path d="M36 218 H360" stroke="#F2B9A0"/>
      <path d="M36 256 H310" stroke="#F2B9A0"/>
      <path d="M36 294 H384" stroke="#EE9C7C"/>
      <path d="M36 332 H340" stroke="#EE9C7C"/>
      <path d="M36 370 H370" stroke="#EE9C7C"/>
    </g>
  </g>
  <!-- sticky notes: one more rule, again -->
  <g transform="translate(560 640) rotate(7)">
    <rect x="6" y="8" width="170" height="120" fill="#5B4A36" opacity="0.16" filter="url(#soft)"/>
    <rect width="170" height="120" fill="#FFE08A"/>
    <text x="85" y="56" font-size="27" font-weight="700" fill="#5B4A36" text-anchor="middle">+ 규칙 추가</text>
    <text x="85" y="92" font-size="22" fill="#8A6F3B" text-anchor="middle">또?</text>
  </g>

  <!-- inverted pyramid -->
  <g transform="translate(960 300)">
    <g stroke="#FBF3E2" stroke-width="6" stroke-linejoin="round">
      <path d="M0 0 H660 L594 96 H66 Z" fill="#E8743B"/>
      <path d="M66 96 H594 L528 192 H132 Z" fill="#F0A45B"/>
      <path d="M132 192 H528 L462 288 H198 Z" fill="#F5CC87"/>
      <path d="M198 288 H462 L396 384 H264 Z" fill="#C9D6BB"/>
      <path d="M264 384 H396 L330 480 Z" fill="#9DB392"/>
    </g>
    <g text-anchor="middle" font-weight="800" fill="#2B2118">
      <text x="330" y="63" font-size="44" fill="#FFFDF8">코드베이스</text>
      <text x="330" y="158" font-size="40">정적 분석</text>
      <text x="330" y="253" font-size="38">검증</text>
      <text x="330" y="347" font-size="32">산문</text>
    </g>
    <path d="M352 440 H470" stroke="#6B7F63" stroke-width="4" stroke-linecap="round"/>
    <text x="484" y="452" font-size="32" font-weight="800" fill="#4F6349">사람의 리뷰</text>
  </g>

  <!-- robot pointing at the top layer -->
  <g transform="translate(780 505)">
    <ellipse cx="95" cy="372" rx="120" ry="18" fill="#5B4A36" opacity="0.18"/>
    <!-- antenna -->
    <path d="M95 30 V-6" stroke="#6E7781" stroke-width="7" stroke-linecap="round"/>
    <circle cx="95" cy="-18" r="15" fill="#E8743B"/>
    <path d="M62 -34 L50 -52 M95 -46 V-70 M128 -34 L140 -52" stroke="#F0A45B" stroke-width="6" stroke-linecap="round"/>
    <!-- head -->
    <rect x="10" y="30" width="170" height="130" rx="42" fill="#F4F1EA" stroke="#B9B4A8" stroke-width="5"/>
    <rect x="30" y="58" width="130" height="72" rx="30" fill="#2F3440"/>
    <path d="M56 100 Q70 80 84 100" stroke="#FFC46B" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M106 100 Q120 80 134 100" stroke="#FFC46B" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="4" cy="96" r="16" fill="#F0A45B"/><circle cx="186" cy="96" r="16" fill="#F0A45B"/>
    <!-- body -->
    <rect x="28" y="172" width="134" height="150" rx="34" fill="#E9E5DC" stroke="#B9B4A8" stroke-width="5"/>
    <circle cx="95" cy="246" r="26" fill="#F4F1EA" stroke="#E8743B" stroke-width="7"/>
    <path d="M83 247 L92 257 L108 237" stroke="#E8743B" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- arms -->
    <path d="M160 206 Q214 176 232 112" stroke="#8A919A" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="234" cy="100" r="22" fill="#F4F1EA" stroke="#B9B4A8" stroke-width="5"/>
    <path d="M30 210 Q-6 250 6 296" stroke="#8A919A" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="8" cy="304" r="20" fill="#F4F1EA" stroke="#B9B4A8" stroke-width="5"/>
    <!-- legs -->
    <rect x="48" y="318" width="34" height="46" rx="12" fill="#8A919A"/>
    <rect x="108" y="318" width="34" height="46" rx="12" fill="#8A919A"/>
  </g>

  <!-- title -->
  <g font-weight="900" fill="#1E1A16">
    <text x="92" y="176" font-size="112" letter-spacing="-3">같은 실수를 또 한다면,</text>
    <text x="92" y="318" font-size="112" letter-spacing="-3">규칙보다 <tspan fill="#DB5A2B">환경</tspan>을</text>
  </g>
  <text x="96" y="398" font-size="44" font-weight="500" fill="#6B7F63" letter-spacing="-1">AI 코딩 에이전트를 믿는 방법이 바뀌고 있다</text>

  <rect width="1672" height="941" filter="url(#grain)" opacity="0.55"/>
</svg>
</body>
</html>
